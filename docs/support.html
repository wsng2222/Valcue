<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valcue Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light dark; --bg:#ffffff; --surface:#ffffff; --text:#1c1c1e; --muted:#8e8e93; --line:#e5e5ea; --accent:#f44336; }
    @media (prefers-color-scheme: dark) { :root { --bg:#000000; --surface:#1c1c1e; --text:#ffffff; --muted:#8e8e93; --line:#38383a; --accent:#ef5350; } }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Lato',-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",sans-serif; background:var(--bg); color:var(--text); line-height:1.65; }
    main { max-width:900px; margin:0 auto; padding:32px 20px 64px; }
    .toolbar { display:flex; justify-content:flex-end; margin-bottom:12px; }
    .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    select { max-width:100%; padding:10px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--text); font:inherit; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:clamp(22px,5vw,36px); box-shadow:0 8px 24px rgba(0,0,0,.05); }
    h1,h2 { line-height:1.25; margin-top:0; }
    h1 { font-size:clamp(1.65rem,5vw,2rem); font-weight:800; letter-spacing:-0.5px; margin-bottom:8px; }
    h2 { font-size:1.1rem; font-weight:700; margin:30px 0 10px; color:var(--accent); }
    p,li { color:var(--muted); }
    ul { padding-inline-start:22px; }
    .meta { margin:0 0 24px; color:var(--muted); }
    a { color:var(--accent); overflow-wrap:anywhere; }
    .faq-item { margin-bottom:18px; }
    .faq-item p { margin:4px 0 0; }
    .contact-box { margin-top:8px; padding:18px 20px; border:1px solid var(--line); border-radius:14px; background:var(--bg); }
    .contact-box a { font-weight:600; }
  </style>
</head>
<body>
  <main>
    <div class="toolbar"><label><span id="language-label" class="visually-hidden"></span><select id="language"></select></label></div>
    <article id="support" class="card"></article>
  </main>
  <script>
    const names = { en:'English', ko:'한국어' };
    const languageLabels = { en:'Language', ko:'언어' };
    const copy = {
      en: {
        title:'Valcue Support', intro:'Need help with Valcue? Check the frequently asked questions below, or reach out to us directly — we usually reply within 1-2 business days.',
        faqH:'Frequently asked questions',
        faq:[
          { q:'How do I create a routine?', a:'Open the Routines tab and tap “Create custom routine” to build one interval by interval, or use the AI routine generator to build one automatically from your target distance and difficulty.' },
          { q:'Why did interval alerts stop while my screen was off?', a:'Make sure notifications are allowed for Valcue in your device Settings, and that “Alerts when screen is off” is enabled inside the app’s workout settings.' },
          { q:'How do I share a routine with someone else?', a:'Open a saved routine and tap “Share routine” to generate a QR code or link. The other person can scan the code or open the link inside Valcue to import it.' },
          { q:'What do I get with Premium?', a:'Premium unlocks bike and stair-climbing (StairMaster) routines, voice guidance during sessions, unlimited saved routines, and all future feature updates.' },
          { q:'How do I delete my data?', a:'Routines and workout history are stored on your device. You can delete individual records inside the app, or remove everything by uninstalling the app. For shared routine links, contact us with the link ID to request deletion.' }
        ],
        contactH:'Still need help?', contactIntro:'Email us and include your device model, iOS/Android version, and Valcue app version if you’re reporting a bug.',
        contactLabel:'Contact support', privacyLink:'Privacy Policy'
      },
      ko: {
        title:'Valcue 지원', intro:'Valcue 이용 중 궁금한 점이 있으신가요? 아래 자주 묻는 질문을 확인하시거나 직접 문의해 주세요. 보통 영업일 기준 1~2일 내에 답변드립니다.',
        faqH:'자주 묻는 질문',
        faq:[
          { q:'루틴은 어떻게 만드나요?', a:'루틴 탭에서 “새 커스텀 루틴 만들기”를 눌러 구간을 직접 구성하거나, AI 루틴 생성 기능으로 목표 거리와 난이도에 맞는 루틴을 자동으로 만들 수 있습니다.' },
          { q:'화면이 꺼지면 구간 알림이 안 와요.', a:'기기 설정에서 Valcue의 알림 권한이 허용되어 있는지, 그리고 앱 내 운동 설정에서 “화면 꺼짐 중에도 알림”이 켜져 있는지 확인해 주세요.' },
          { q:'루틴을 다른 사람과 공유하려면?', a:'저장된 루틴을 열고 “루틴 공유하기”를 누르면 QR 코드와 링크가 생성됩니다. 상대방은 QR 코드를 스캔하거나 링크를 Valcue 앱에서 열어 루틴을 가져올 수 있습니다.' },
          { q:'프리미엄에 가입하면 무엇이 달라지나요?', a:'프리미엄에서는 사이클과 천국의 계단(스텝밀) 루틴, 운동 중 음성 가이드, 무제한 루틴 저장, 그리고 향후 추가되는 모든 기능을 이용할 수 있습니다.' },
          { q:'제 데이터는 어떻게 삭제하나요?', a:'루틴과 운동 기록은 기기에 저장됩니다. 앱 내에서 개별 기록을 삭제하거나, 앱을 삭제하면 모든 데이터가 함께 제거됩니다. 공유된 루틴 링크의 삭제를 원하시면 링크 ID와 함께 문의해 주세요.' }
        ],
        contactH:'추가 도움이 필요하신가요?', contactIntro:'버그를 신고하시는 경우 기기 모델, iOS/Android 버전, Valcue 앱 버전을 함께 적어서 이메일로 보내주세요.',
        contactLabel:'문의하기', privacyLink:'개인정보처리방침'
      }
    };
    function render(lang) {
      const c = copy[lang] || copy.en;
      const article = document.getElementById('support');
      const faqHtml = c.faq.map(item => `<div class="faq-item"><strong>${item.q}</strong><p>${item.a}</p></div>`).join('');
      article.innerHTML = `
        <h1>${c.title}</h1>
        <p class="meta">${c.intro}</p>
        <h2>${c.faqH}</h2>
        ${faqHtml}
        <h2>${c.contactH}</h2>
        <p>${c.contactIntro}</p>
        <div class="contact-box">
          <a href="mailto:nogic.official@gmail.com">${c.contactLabel}: nogic.official@gmail.com</a>
        </div>
        <p style="margin-top:24px;"><a href="./privacy-policy.html">${c.privacyLink}</a></p>
      `;
      document.documentElement.lang = lang;
      document.title = c.title;
    }
    function initLanguageSelect() {
      const select = document.getElementById('language');
      const label = document.getElementById('language-label');
      const browserLang = (navigator.language || 'en').slice(0,2);
      const initial = names[browserLang] ? browserLang : 'en';
      Object.keys(names).forEach(code => {
        const opt = document.createElement('option');
        opt.value = code; opt.textContent = names[code];
        if (code === initial) opt.selected = true;
        select.appendChild(opt);
      });
      label.textContent = languageLabels[initial];
      select.addEventListener('change', () => {
        label.textContent = languageLabels[select.value] || languageLabels.en;
        render(select.value);
      });
      render(initial);
    }
    initLanguageSelect();
  </script>
</body>
</html>
