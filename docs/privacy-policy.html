<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valcue Privacy Policy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light dark; --bg:#ffffff; --surface:#ffffff; --text:#1c1c1e; --muted:#8e8e93; --line:#e5e5ea; --accent:#f44336; }
    @media (prefers-color-scheme: dark) { :root { --bg:#000000; --surface:#1c1c1e; --text:#ffffff; --muted:#8e8e93; --line:#38383a; --accent:#ef5350; } }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Lato',-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",sans-serif; background:var(--bg); color:var(--text); line-height:1.65; }
    main { max-width:900px; margin:0 auto; padding:32px 20px 64px; }
    .toolbar { display:flex; justify-content:flex-end; margin-bottom:12px; }
    .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    select { max-width:100%; padding:10px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--text); font:inherit; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:clamp(22px,5vw,36px); box-shadow:0 8px 24px rgba(0,0,0,.05); }
    h1,h2 { line-height:1.25; margin-top:0; }
    h1 { font-size:clamp(1.65rem,5vw,2rem); font-weight:800; letter-spacing:-0.5px; margin-bottom:8px; }
    h2 { font-size:1.1rem; font-weight:700; margin:30px 0 10px; color:var(--accent); }
    p,li { color:var(--muted); }
    ul { padding-inline-start:22px; }
    .meta { margin:0 0 24px; color:var(--muted); }
    a { color:var(--accent); overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <main>
    <div class="toolbar"><label><span id="language-label" class="visually-hidden"></span><select id="language"></select></label></div>
    <article id="policy" class="card"></article>
  </main>
  <script>
    const names = { en:'English', es:'Español', fr:'Français', de:'Deutsch', it:'Italiano', nl:'Nederlands', da:'Dansk', nb:'Norsk bokmål', ru:'Русский', pt:'Português (Brasil)', ja:'日本語', zh:'简体中文', ko:'한국어', vi:'Tiếng Việt', ar:'العربية', th:'ไทย' };
    const languageLabels = { en:'Language', es:'Idioma', fr:'Langue', de:'Sprache', it:'Lingua', nl:'Taal', da:'Sprog', nb:'Språk', ru:'Язык', pt:'Idioma', ja:'言語', zh:'语言', ko:'언어', vi:'Ngôn ngữ', ar:'اللغة', th:'ภาษา' };
    const copy = {
      en: {
        title:'Valcue Privacy Policy', updated:'Last updated: September 11, 2026', intro:'This policy explains how Valcue (the “App”), published by Nogic, handles information. You can use Valcue without an account; signing in with Apple or Google is optional and is used to back up your records.',
        summaryH:'1. Summary', summary:['Workout history, routines, weight records, goals, and settings are mainly stored on your device.','Google Mobile Ads and Google Analytics for Firebase may process device, interaction, diagnostic, and approximate-location data.','If you sign in with Apple or Google, your workout history, weight records, and routines are backed up to your account on Google Firebase so they can be restored on another phone.','Without signing in, those records stay on your device. Valcue never reads data from Apple Health or Health Connect; it only saves finished workouts there if you turn that on.'],
        localH:'2. Data stored on your device', local:'The App stores routines, workout history, weight and goal data, preferences, reminder schedules, and premium-feature state in on-device storage. This data remains there until you delete records, clear the App’s storage, or uninstall the App.',
        thirdH:'3. Third-party services', third:['Google Mobile Ads (AdMob) may process IP-derived approximate location, device or advertising identifiers, app interactions, and diagnostics to provide ads, prevent fraud, maintain security, and meet legal obligations.','Google Analytics for Firebase records product events such as onboarding, routine creation, workout starts and completions, and premium-screen interactions. Valcue does not put routine names, weight values, or workout-history records in those analytics events.','Firebase Authentication creates an anonymous identifier when the App starts, and App Check may process IP address, user agent, and device/app attestation data to protect the App’s cloud features.','If you sign in, Apple or Google shares your account identifier and, depending on your choices, your email address and name. With Sign in with Apple you can hide your email address.','RevenueCat processes purchase and subscription status, an app user identifier, and device information to manage Premium. When you are signed in, that identifier is linked to your account so purchases follow you to a new phone.','Firebase Crashlytics collects crash reports with device model, OS version, and app state at the time of a crash so we can fix problems.'],
        cloudH:'4. Optional cloud features', cloud:['Backup (only when signed in): workout history (date, machine type, duration, distance, average RPM or level, routine name), weight entries (date and weight), and routines (name, difficulty, machine type, intervals) are stored in Google Firebase under your account. They sync when you sign in, when the App opens or goes to the background, and before you sign out.','Only your signed-in account can read or change your backup.','Creating a short routine link uploads the routine name, machine type, and interval details under a random link ID. Anyone with that link may retrieve the routine. If the cloud service is unavailable, the routine is embedded directly in a longer link instead.','Remote iOS Live Activity updates may send an anonymous identifier, ActivityKit push token, workout-session schedule, and display-ready routine/interval text. Active schedule records expire within 12 hours; cancellation records may be retained for up to 24 hours.','Shared short-link routines currently remain until operational deletion or a valid deletion request. To request deletion, contact us with the link ID.'],
        permissionsH:'5. Device permissions and sharing', permissions:['Notifications are used only when you enable workout reminders or background interval updates.','Camera access is used only when you choose to scan a routine QR code or take a workout photo. Photos stay on your device unless you share them.','The clipboard is checked only to recognize a Valcue routine link for import.','Anything you share is handled by the app or service you select in the system share sheet.','Apple Health and Health Connect are used only if you turn on health sync, and only to save finished workouts, active energy, and distance. The App does not read your health data, and nothing from those apps is sent to Valcue’s servers.'],
        retentionH:'6. Retention, deletion, and choices', retention:'Local data can be removed inside the App where supported, by clearing app storage, or by uninstalling. You can disable reminders, background updates, and camera access in system settings. Google retains third-party data under its own policies. For deletion of a shared routine or other Valcue cloud record, use the contact below and include the relevant link or session details if available. Signing out keeps your records on this device. You can delete your account from Settings; this permanently removes your backup and your sign-in account from our servers, while records already on the device stay there until you delete them.',
        safetyH:'7. Children and security', safety:'Valcue is intended for a general fitness audience, primarily adults, and is not directed to children. Off-device traffic uses encrypted transport. No system can guarantee absolute security, so avoid putting sensitive personal information in routine names or shared links.',
        changesH:'8. Changes', changes:'We may update this policy when the App or its services change. The current version will remain at this URL with a revised update date.',
        contactH:'9. Contact', contact:'For privacy questions, access, or deletion requests, contact Nogic through the support channel on the App Store or the project issue page.', more:'Provider privacy information'
      },
      ko: {
        title:'Valcue 개인정보처리방침', updated:'최종 업데이트: 2026년 9월 11일', intro:'이 방침은 Nogic이 제공하는 Valcue(이하 “앱”)가 정보를 처리하는 방식을 설명합니다. 계정 없이도 앱을 사용할 수 있으며, Apple 또는 Google 로그인은 선택 사항으로 기록 백업에 사용됩니다.',
        summaryH:'1. 요약', summary:['운동 기록, 루틴, 체중 기록, 목표와 설정은 대부분 사용자의 기기에 저장됩니다.','Google 모바일 광고와 Firebase용 Google 애널리틱스는 기기, 앱 사용, 진단 및 대략적 위치 정보를 처리할 수 있습니다.','Apple 또는 Google로 로그인하면 운동 기록, 체중 기록과 루틴이 Google Firebase의 계정 공간에 백업되어 다른 휴대폰에서도 복원할 수 있습니다.','로그인하지 않으면 해당 기록은 기기에만 남습니다. Valcue는 Apple 건강 앱이나 Health Connect의 데이터를 읽지 않으며, 사용자가 켠 경우에만 완료한 운동을 저장합니다.'],
        localH:'2. 기기에 저장되는 정보', local:'앱은 루틴, 운동 기록, 체중과 목표, 환경설정, 알림 일정 및 프리미엄 기능 상태를 기기 내부 저장소에 보관합니다. 해당 정보는 앱에서 기록을 삭제하거나, 앱 저장 공간을 지우거나, 앱을 제거할 때까지 기기에 남습니다.',
        thirdH:'3. 제3자 서비스', third:['Google 모바일 광고(AdMob)는 광고 제공, 부정행위 방지, 보안 유지 및 법적 의무 이행을 위해 IP 주소에서 추정한 대략적 위치, 기기 또는 광고 식별자, 앱 사용 정보와 진단 정보를 처리할 수 있습니다.','Firebase용 Google 애널리틱스는 온보딩, 루틴 생성, 운동 시작·완료, 프리미엄 화면 이용과 같은 제품 이벤트를 기록합니다. Valcue는 분석 이벤트에 루틴 이름, 체중 값 또는 운동 기록을 넣지 않습니다.','Firebase Authentication은 앱을 시작할 때 익명 식별자를 만들며, App Check는 앱의 클라우드 기능을 보호하기 위해 IP 주소, 사용자 에이전트 및 기기·앱 증명 정보를 처리할 수 있습니다.','로그인하면 Apple 또는 Google이 계정 식별자와, 사용자의 선택에 따라 이메일 주소와 이름을 제공합니다. Apple로 로그인할 때는 이메일 주소를 가릴 수 있습니다.','RevenueCat은 프리미엄 관리를 위해 구매·구독 상태, 앱 사용자 식별자와 기기 정보를 처리합니다. 로그인한 경우 이 식별자가 계정과 연결되어 새 휴대폰에서도 구매 내역이 유지됩니다.','Firebase Crashlytics는 문제를 고치기 위해 앱이 비정상 종료될 때 기기 모델, OS 버전, 당시 앱 상태가 담긴 오류 보고서를 수집합니다.'],
        cloudH:'4. 선택형 클라우드 기능', cloud:['백업(로그인한 경우에만): 운동 기록(날짜, 기구 종류, 운동 시간, 거리, 평균 RPM 또는 레벨, 루틴 이름), 체중 기록(날짜와 체중), 루틴(이름, 난이도, 기구 종류, 구간)이 계정별로 Google Firebase에 저장됩니다. 로그인할 때, 앱을 열거나 백그라운드로 보낼 때, 로그아웃하기 전에 동기화됩니다.','백업은 로그인한 본인 계정만 읽고 수정할 수 있습니다.','짧은 루틴 링크를 만들면 루틴 이름, 기구 종류와 구간 정보가 임의의 링크 ID로 업로드됩니다. 링크를 가진 사람은 누구나 루틴을 불러올 수 있습니다. 클라우드 서비스를 사용할 수 없으면 해당 정보가 긴 링크 자체에 포함됩니다.','iOS 실시간 현황을 원격으로 갱신할 때 익명 식별자, ActivityKit 푸시 토큰, 운동 일정과 화면 표시용 루틴·구간 문구가 전송될 수 있습니다. 활성 일정 기록은 12시간 안에 만료되며, 취소 기록은 최대 24시간 보관될 수 있습니다.','짧은 링크로 공유한 루틴은 운영상 삭제되거나 유효한 삭제 요청을 받을 때까지 보관될 수 있습니다. 삭제를 요청하려면 링크 ID와 함께 문의해 주세요.'],
        permissionsH:'5. 기기 권한과 공유', permissions:['운동 알림 또는 백그라운드 구간 업데이트를 켠 경우에만 알림 권한을 사용합니다.','카메라는 루틴 QR 코드를 스캔하거나 운동 사진을 촬영할 때만 사용합니다. 사진은 직접 공유하지 않는 한 기기에 남습니다.','클립보드는 가져올 수 있는 Valcue 루틴 링크인지 확인하는 용도로만 읽습니다.','사용자가 공유한 정보는 시스템 공유 메뉴에서 선택한 앱 또는 서비스가 처리합니다.','Apple 건강 앱과 Health Connect는 건강 동기화를 켠 경우에만, 완료한 운동, 활동 에너지, 거리를 저장하는 데만 사용합니다. 앱은 건강 데이터를 읽지 않으며, 해당 앱의 정보는 Valcue 서버로 전송되지 않습니다.'],
        retentionH:'6. 보관, 삭제 및 선택권', retention:'앱이 지원하는 화면에서 기록을 삭제하거나, 앱 저장 공간을 지우거나, 앱을 제거해 로컬 정보를 삭제할 수 있습니다. 시스템 설정에서 알림, 백그라운드 업데이트와 카메라 권한을 끌 수 있습니다. Google은 자체 방침에 따라 제3자 정보를 보관합니다. 공유 루틴이나 다른 Valcue 클라우드 기록의 삭제를 요청하려면 가능한 경우 관련 링크 또는 세션 정보와 함께 아래 연락처로 문의해 주세요. 로그아웃해도 기기의 기록은 그대로 남습니다. 설정에서 계정을 삭제하면 서버의 백업과 로그인 계정이 영구 삭제되며, 이미 기기에 있는 기록은 직접 삭제할 때까지 남습니다.',
        safetyH:'7. 아동과 보안', safety:'Valcue는 주로 성인을 대상으로 한 일반 피트니스 앱이며 아동을 대상으로 하지 않습니다. 기기 외부로 전송되는 데이터는 암호화된 통신을 사용합니다. 어떤 시스템도 완전한 보안을 보장할 수 없으므로 루틴 이름이나 공유 링크에 민감한 개인정보를 넣지 마세요.',
        changesH:'8. 방침 변경', changes:'앱이나 서비스가 바뀌면 이 방침을 업데이트할 수 있습니다. 최신 방침과 변경된 날짜는 이 주소에 게시됩니다.',
        contactH:'9. 문의', contact:'개인정보 관련 질문, 열람 또는 삭제 요청은 App Store에 표시된 지원 채널이나 프로젝트 이슈 페이지를 통해 Nogic에 문의해 주세요.', more:'서비스 제공업체 개인정보 안내'
      },
      ja: {
        title:'Valcue プライバシーポリシー', updated:'最終更新日：2026年9月11日', intro:'このポリシーは、Nogicが提供するValcue（以下「本アプリ」）による情報の取り扱いについて説明します。本アプリはアカウントなしで利用でき、AppleまたはGoogleでのログインは任意で、記録のバックアップに使用されます。',
        summaryH:'1. 概要', summary:['ワークアウト履歴、ルーティン、体重記録、目標、設定は主に端末内に保存されます。','Google Mobile AdsとGoogle Analytics for Firebaseは、端末情報、操作情報、診断情報、IPアドレスから推定されるおおよその位置情報を処理する場合があります。','AppleまたはGoogleでログインすると、ワークアウト履歴、体重記録、ルーティンがGoogle Firebase上のアカウントにバックアップされ、別の端末でも復元できます。','ログインしない場合、これらの記録は端末内にのみ保存されます。ValcueはAppleヘルスケアやHealth Connectのデータを読み取らず、設定をオンにした場合にのみ完了したワークアウトを保存します。'],
        localH:'2. 端末に保存されるデータ', local:'本アプリは、ルーティン、ワークアウト履歴、体重と目標、各種設定、リマインダー予定、プレミアム機能の状態を端末内に保存します。これらは、アプリ内で削除する、アプリのデータを消去する、またはアプリをアンインストールするまで端末に残ります。',
        thirdH:'3. 第三者サービス', third:['Google Mobile Ads（AdMob）は、広告配信、不正防止、セキュリティ維持、法令遵守のため、IPアドレスから推定されるおおよその位置、端末または広告識別子、アプリ操作、診断情報を処理する場合があります。','Google Analytics for Firebaseは、オンボーディング、ルーティン作成、ワークアウトの開始・完了、プレミアム画面の操作などを記録します。分析イベントにルーティン名、体重値、ワークアウト履歴は含めません。','Firebase Authenticationはアプリ起動時に匿名の識別子を作成し、App Checkはクラウド機能を保護するためにIPアドレス、ユーザーエージェント、端末・アプリの証明情報を処理することがあります。','ログインすると、AppleまたはGoogleからアカウント識別子と、選択に応じてメールアドレスや名前が提供されます。Appleでサインインではメールアドレスを非公開にできます。','RevenueCatはプレミアムの管理のため、購入・サブスクリプションの状態、アプリのユーザー識別子、端末情報を処理します。ログイン中はこの識別子がアカウントに紐づき、新しい端末でも購入が引き継がれます。','Firebase Crashlyticsは不具合を修正するため、アプリの異常終了時に端末モデル、OSバージョン、その時点のアプリの状態を含むクラッシュレポートを収集します。'],
        cloudH:'4. 任意のクラウド機能', cloud:['バックアップ（ログイン時のみ）：ワークアウト履歴（日時、マシンの種類、時間、距離、平均RPMまたはレベル、ルーティン名）、体重記録（日付と体重）、ルーティン（名前、難易度、マシンの種類、インターバル）がアカウントごとにGoogle Firebaseに保存されます。ログイン時、アプリを開いたときやバックグラウンドに移ったとき、ログアウト前に同期されます。','バックアップを閲覧・変更できるのは、ログインしている本人のアカウントだけです。','短縮ルーティンリンクを作成すると、ルーティン名、マシン種別、インターバル内容がランダムなリンクIDでアップロードされます。リンクを知っている人は誰でも取得できます。クラウドが利用できない場合は、情報を長いリンク自体に埋め込みます。','iOSのLive Activityをリモート更新するため、匿名識別子、ActivityKitプッシュトークン、ワークアウト予定、表示用のルーティン・インターバル文言を送信する場合があります。有効な予定は12時間以内に失効し、キャンセル記録は最大24時間保持される場合があります。','短縮リンクで共有したルーティンは、運用上削除されるか、有効な削除依頼を受けるまで保存される場合があります。削除依頼にはリンクIDを添えてください。'],
        permissionsH:'5. 端末権限と共有', permissions:['通知は、ワークアウトリマインダーまたはバックグラウンド更新を有効にした場合だけ使用します。','カメラは、ルーティンのQRコードをスキャンする場合またはワークアウト写真を撮影する場合だけ使用します。写真は、共有しない限り端末内に残ります。','クリップボードは、取り込み可能なValcueルーティンリンクを検出する目的でのみ確認します。','共有した情報は、システムの共有画面で選択したアプリまたはサービスが取り扱います。','AppleヘルスケアとHealth Connectは、ヘルスケア連携をオンにした場合にのみ、完了したワークアウト、アクティブエネルギー、距離の保存に使用します。本アプリはヘルスケアデータを読み取らず、それらのアプリの情報がValcueのサーバーに送信されることはありません。'],
        retentionH:'6. 保存期間、削除、選択', retention:'対応するアプリ画面で記録を削除する、アプリデータを消去する、またはアンインストールすることでローカルデータを削除できます。通知、バックグラウンド更新、カメラ権限は端末設定で無効にできます。Googleによるデータ保持には同社のポリシーが適用されます。共有ルーティンなどValcueのクラウド記録の削除は、該当するリンクまたはセッション情報を添えて下記までご依頼ください。 ログアウトしても端末内の記録は残ります。設定からアカウントを削除すると、サーバー上のバックアップとログインアカウントが完全に削除されます。端末内の記録は、ご自身で削除するまで残ります。',
        safetyH:'7. 子どもとセキュリティ', safety:'Valcueは主に成人向けの一般的なフィットネスアプリであり、子どもを対象としていません。端末外への通信には暗号化を使用します。ただし完全な安全性は保証できないため、ルーティン名や共有リンクに機微な個人情報を入力しないでください。',
        changesH:'8. ポリシーの変更', changes:'本アプリまたはサービスの変更に伴い、本ポリシーを更新する場合があります。最新版と更新日は同じURLに掲載します。',
        contactH:'9. お問い合わせ', contact:'プライバシーに関する質問、開示・削除のご依頼は、App Storeに記載されたサポート窓口またはプロジェクトのIssueページからNogicへご連絡ください。', more:'サービス提供者のプライバシー情報'
      },
      zh: {
        title:'Valcue 隐私政策', updated:'最后更新：2026年9月11日', intro:'本政策说明由 Nogic 发布的 Valcue（以下简称“应用”）如何处理信息。无需账号即可使用 Valcue；使用 Apple 或 Google 登录是可选的，用于备份你的记录。',
        summaryH:'1. 概要', summary:['训练历史、训练计划、体重记录、目标和设置主要存储在你的设备上。','Google 移动广告和 Google Analytics for Firebase 可能会处理设备、互动、诊断以及由 IP 地址推断的大致位置信息。','如果你使用 Apple 或 Google 登录，你的锻炼记录、体重记录和训练计划会备份到 Google Firebase 上你的账号中，以便在其他手机上恢复。','如果不登录，这些记录只保存在你的设备上。Valcue 不会读取 Apple 健康或 Health Connect 的数据，只会在你开启后保存已完成的锻炼。'],
        localH:'2. 存储在设备上的数据', local:'本应用会在设备本地存储训练计划、训练历史、体重和目标、偏好设置、提醒计划以及高级功能状态。这些数据会保留到你在应用内删除记录、清除应用数据或卸载应用为止。',
        thirdH:'3. 第三方服务', third:['Google 移动广告（AdMob）可能会处理由 IP 推断的大致位置、设备或广告标识符、应用互动和诊断信息，用于提供广告、防止欺诈、维护安全及履行法律义务。','Google Analytics for Firebase 会记录新手引导、训练计划创建、训练开始与完成以及高级功能页面互动等产品事件。Valcue 不会在分析事件中加入训练计划名称、体重数值或训练历史记录。','Firebase Authentication 会在应用启动时创建匿名标识符，App Check 可能会处理 IP 地址、用户代理以及设备和应用验证数据，以保护应用的云端功能。','登录时，Apple 或 Google 会提供你的账号标识符，并根据你的选择提供电子邮件地址和姓名。使用“通过 Apple 登录”时，你可以隐藏电子邮件地址。','RevenueCat 会处理购买和订阅状态、应用用户标识符和设备信息，用于管理高级版。登录后，该标识符会与你的账号关联，换新手机后购买记录仍然保留。','Firebase Crashlytics 会在应用崩溃时收集包含设备型号、系统版本和当时应用状态的崩溃报告，以便我们修复问题。'],
        cloudH:'4. 可选云功能', cloud:['备份（仅限登录时）：锻炼记录（日期、器械类型、时长、距离、平均 RPM 或阻力等级、训练计划名称）、体重记录（日期和体重）以及训练计划（名称、难度、器械类型、间歇设置）会按账号存储在 Google Firebase 中。在登录时、打开应用或切换到后台时以及退出登录前进行同步。','只有已登录的本人账号可以读取或修改你的备份。','创建短训练计划链接时，训练计划名称、器械类型和间歇详情会以随机链接 ID 上传。任何持有链接的人都能获取该训练计划。如果云服务不可用，数据会直接嵌入较长的链接中。','远程更新 iOS 实时活动时，可能会发送匿名标识符、ActivityKit 推送令牌、训练日程以及用于显示的训练计划和间歇文字。有效日程记录会在 12 小时内过期，取消记录最多可保留 24 小时。','通过短链接分享的训练计划可能会保留到运营清理或收到有效删除请求为止。如需删除，请在联系时提供链接 ID。'],
        permissionsH:'5. 设备权限与分享', permissions:['仅在你启用训练提醒或后台间歇更新时使用通知权限。','仅在你扫描训练计划二维码或拍摄训练照片时使用相机。除非你主动分享，照片会留在设备上。','剪贴板仅用于识别可导入的 Valcue 训练计划链接。','你主动分享的信息由系统分享面板中选择的应用或服务处理。','仅在你开启健康同步时，应用才会使用 Apple 健康和 Health Connect，并且只用于保存已完成的锻炼、活动能量和距离。应用不会读取你的健康数据，这些应用中的信息也不会发送到 Valcue 的服务器。'],
        retentionH:'6. 保留、删除与选择', retention:'你可以在应用支持的页面中删除记录，也可以清除应用数据或卸载应用来删除本地数据。通知、后台更新和相机权限可在系统设置中关闭。Google 会按其自身政策保留第三方数据。如需删除已分享的训练计划或其他 Valcue 云记录，请通过下方方式联系，并尽可能提供相关链接或会话信息。 退出登录后，设备上的记录仍会保留。你可以在设置中删除账号，这会永久删除服务器上的备份和登录账号；设备上已有的记录会保留，直到你自行删除。',
        safetyH:'7. 儿童与安全', safety:'Valcue 面向一般健身人群，主要服务成年人，并非为儿童设计。设备外传输使用加密连接。任何系统都无法保证绝对安全，请勿在训练计划名称或分享链接中填写敏感个人信息。',
        changesH:'8. 政策变更', changes:'本应用或服务发生变化时，我们可能会更新本政策。最新版及更新日期会继续发布在此网址。',
        contactH:'9. 联系方式', contact:'如有隐私问题或数据访问、删除请求，请通过 App Store 中的支持渠道或项目 Issue 页面联系 Nogic。', more:'服务提供商隐私信息'
      },
      es: {
        title:'Política de privacidad de Valcue', updated:'Última actualización: 11 de septiembre de 2026', intro:'Esta política explica cómo Valcue (la “App”), publicada por Nogic, trata la información. Puedes usar Valcue sin una cuenta; iniciar sesión con Apple o Google es opcional y sirve para hacer copias de seguridad de tus registros.',
        summaryH:'1. Resumen', summary:['El historial de entrenamiento, las rutinas, los registros de peso, los objetivos y los ajustes se guardan principalmente en el dispositivo.','Google Mobile Ads y Google Analytics for Firebase pueden tratar datos del dispositivo, de interacción, de diagnóstico y de ubicación aproximada.','Si inicias sesión con Apple o Google, tu historial de entrenamientos, tus registros de peso y tus rutinas se guardan como copia de seguridad en tu cuenta en Google Firebase para poder restaurarlos en otro teléfono.','Si no inicias sesión, esos registros permanecen en tu dispositivo. Valcue nunca lee datos de Apple Salud ni de Health Connect; solo guarda allí los entrenamientos terminados si activas esa opción.'],
        localH:'2. Datos guardados en el dispositivo', local:'La Aplicación guarda localmente rutinas, historial de entrenamientos, peso y objetivos, preferencias, horarios de recordatorios y el estado de funciones Premium. Los datos permanecen hasta que elimines los registros, borres los datos de la Aplicación o la desinstales.',
        thirdH:'3. Servicios de terceros', third:['Google Mobile Ads (AdMob) puede tratar la ubicación aproximada derivada de la IP, identificadores del dispositivo o publicitarios, interacciones y diagnósticos para mostrar anuncios, prevenir fraude, mantener la seguridad y cumplir obligaciones legales.','Google Analytics for Firebase registra eventos como la incorporación, la creación de rutinas, el inicio y fin de entrenamientos y las interacciones con pantallas Premium. Valcue no incluye nombres de rutinas, valores de peso ni registros del historial en esos eventos.','Firebase Authentication crea un identificador anónimo al iniciar la App, y App Check puede procesar la dirección IP, el agente de usuario y datos de verificación del dispositivo o de la app para proteger las funciones en la nube.','Si inicias sesión, Apple o Google comparten el identificador de tu cuenta y, según lo que elijas, tu correo electrónico y tu nombre. Con Iniciar sesión con Apple puedes ocultar tu correo.','RevenueCat procesa el estado de compras y suscripciones, un identificador de usuario de la app e información del dispositivo para gestionar Premium. Si has iniciado sesión, ese identificador se vincula a tu cuenta para que tus compras te acompañen a un teléfono nuevo.','Firebase Crashlytics recopila informes de fallos con el modelo del dispositivo, la versión del sistema y el estado de la App en el momento del fallo para que podamos corregir problemas.'],
        cloudH:'4. Funciones opcionales en la nube', cloud:['Copia de seguridad (solo con sesión iniciada): el historial de entrenamientos (fecha, tipo de máquina, duración, distancia, RPM o nivel medio, nombre de la rutina), los registros de peso (fecha y peso) y las rutinas (nombre, dificultad, tipo de máquina, intervalos) se guardan en Google Firebase bajo tu cuenta. Se sincronizan al iniciar sesión, al abrir la App o pasarla a segundo plano y antes de cerrar sesión.','Solo tu cuenta con sesión iniciada puede leer o modificar tu copia de seguridad.','Al crear un enlace corto se suben el nombre de la rutina, el tipo de máquina y los intervalos con un ID aleatorio. Cualquiera que tenga el enlace puede recuperar la rutina. Si la nube no está disponible, la rutina se integra directamente en un enlace más largo.','Las actualizaciones remotas de Actividades en Directo de iOS pueden enviar un identificador anónimo, el token push de ActivityKit, la programación de la sesión y textos de rutina e intervalos listos para mostrar. Las programaciones activas caducan en un máximo de 12 horas y los registros de cancelación pueden conservarse hasta 24 horas.','Las rutinas de enlaces cortos pueden conservarse hasta su eliminación operativa o hasta recibir una solicitud válida. Para pedir que se borren, indica el ID del enlace.'],
        permissionsH:'5. Permisos y uso compartido', permissions:['Las notificaciones solo se usan si activas recordatorios o actualizaciones de intervalos en segundo plano.','La cámara solo se usa cuando escaneas el código QR de una rutina o haces una foto del entrenamiento. Las fotos permanecen en el dispositivo salvo que las compartas.','El portapapeles solo se consulta para reconocer enlaces de rutinas de Valcue que se puedan importar.','Lo que compartas será tratado por la aplicación o el servicio que elijas en el menú del sistema.','Apple Salud y Health Connect solo se usan si activas la sincronización de salud, y solo para guardar entrenamientos terminados, energía activa y distancia. La App no lee tus datos de salud y nada de esas apps se envía a los servidores de Valcue.'],
        retentionH:'6. Conservación, eliminación y opciones', retention:'Puedes borrar datos locales desde la Aplicación cuando se admita, eliminando sus datos o desinstalándola. Puedes desactivar las notificaciones, las actualizaciones en segundo plano y la cámara en los ajustes del sistema. Google conserva sus datos según sus propias políticas. Para eliminar una rutina compartida u otro registro de Valcue en la nube, usa el contacto inferior e incluye el enlace o los datos de sesión disponibles. Al cerrar sesión, tus registros se conservan en este dispositivo. Puedes eliminar tu cuenta desde Ajustes: se borran de forma permanente tu copia de seguridad y tu cuenta de acceso de nuestros servidores, mientras que los registros del dispositivo se mantienen hasta que los elimines.',
        safetyH:'7. Menores y seguridad', safety:'Valcue está destinada a un público general de fitness, principalmente adulto, y no se dirige a menores. El tráfico externo usa cifrado. Ningún sistema garantiza una seguridad absoluta; evita incluir información personal sensible en nombres de rutinas o enlaces compartidos.',
        changesH:'8. Cambios', changes:'Podemos actualizar esta política cuando cambien la Aplicación o sus servicios. La versión vigente seguirá publicada en esta URL con una nueva fecha.',
        contactH:'9. Contacto', contact:'Para consultas de privacidad o solicitudes de acceso o eliminación, contacta con Nogic mediante el canal de soporte de la App Store o la página de incidencias del proyecto.', more:'Información de privacidad de los proveedores'
      },
      fr: {
        title:'Politique de confidentialité de Valcue', updated:'Dernière mise à jour : 11 septembre 2026', intro:'Cette politique explique comment Valcue (l’« Application »), publiée par Nogic, traite les informations. Vous pouvez utiliser Valcue sans compte ; la connexion avec Apple ou Google est facultative et sert à sauvegarder vos données.',
        summaryH:'1. Résumé', summary:['L’historique des entraînements, les séances, le poids, les objectifs et les réglages sont principalement stockés sur l’appareil.','Google Mobile Ads et Google Analytics for Firebase peuvent traiter des données relatives à l’appareil, aux interactions, aux diagnostics et à la localisation approximative.','Si vous vous connectez avec Apple ou Google, votre historique d’entraînement, vos relevés de poids et vos routines sont sauvegardés dans votre compte sur Google Firebase afin de pouvoir les restaurer sur un autre téléphone.','Sans connexion, ces données restent sur votre appareil. Valcue ne lit jamais les données d’Apple Santé ni de Health Connect ; l’Application y enregistre uniquement les entraînements terminés si vous activez cette option.'],
        localH:'2. Données stockées sur l’appareil', local:'L’Application stocke localement les séances, l’historique des entraînements, le poids et les objectifs, les préférences, les rappels et l’état des fonctions Premium. Ces données restent sur l’appareil jusqu’à leur suppression dans l’Application, l’effacement des données de l’Application ou sa désinstallation.',
        thirdH:'3. Services tiers', third:['Google Mobile Ads (AdMob) peut traiter la localisation approximative déduite de l’adresse IP, des identifiants d’appareil ou publicitaires, les interactions et les diagnostics afin de fournir des publicités, prévenir la fraude, assurer la sécurité et respecter la loi.','Google Analytics for Firebase enregistre des événements tels que l’intégration, la création de séances, le début et la fin d’un entraînement et les interactions avec les écrans Premium. Valcue n’y ajoute ni noms de séances, ni valeurs de poids, ni historique d’entraînement.','Firebase Authentication crée un identifiant anonyme au lancement de l’Application, et App Check peut traiter l’adresse IP, l’agent utilisateur et des données d’attestation de l’appareil ou de l’application pour protéger les fonctions cloud.','Si vous vous connectez, Apple ou Google partage l’identifiant de votre compte et, selon vos choix, votre adresse e-mail et votre nom. Avec Se connecter avec Apple, vous pouvez masquer votre adresse e-mail.','RevenueCat traite l’état des achats et des abonnements, un identifiant utilisateur de l’application et des informations sur l’appareil pour gérer Premium. Lorsque vous êtes connecté, cet identifiant est lié à votre compte afin que vos achats vous suivent sur un nouveau téléphone.','Firebase Crashlytics collecte des rapports de plantage contenant le modèle de l’appareil, la version du système et l’état de l’Application au moment du plantage afin de nous aider à corriger les problèmes.'],
        cloudH:'4. Fonctions cloud facultatives', cloud:['Sauvegarde (uniquement si vous êtes connecté) : l’historique d’entraînement (date, type d’appareil, durée, distance, RPM ou niveau moyen, nom de la routine), les relevés de poids (date et poids) et les routines (nom, difficulté, type d’appareil, intervalles) sont stockés dans Google Firebase sous votre compte. La synchronisation a lieu à la connexion, à l’ouverture de l’Application ou lors de son passage en arrière-plan, et avant la déconnexion.','Seul votre compte connecté peut lire ou modifier votre sauvegarde.','La création d’un lien court téléverse le nom de la séance, le type d’appareil et les intervalles sous un identifiant aléatoire. Toute personne disposant du lien peut récupérer la séance. Si le cloud est indisponible, la séance est directement intégrée à un lien plus long.','Les mises à jour à distance des Activités en direct iOS peuvent transmettre un identifiant anonyme, le jeton push ActivityKit, le planning de la séance et des textes prêts à afficher. Les plannings actifs expirent sous 12 heures ; les traces d’annulation peuvent être conservées jusqu’à 24 heures.','Les séances partagées par lien court peuvent rester enregistrées jusqu’à une suppression opérationnelle ou une demande valable. Pour en demander la suppression, indiquez l’identifiant du lien.'],
        permissionsH:'5. Autorisations et partage', permissions:['Les notifications ne sont utilisées que si vous activez les rappels ou les mises à jour d’intervalles en arrière-plan.','La caméra n’est utilisée que pour scanner le code QR d’une séance ou prendre une photo d’entraînement. Les photos restent sur l’appareil sauf si vous les partagez.','Le presse-papiers est consulté uniquement pour reconnaître un lien de séance Valcue importable.','Tout partage est traité par l’application ou le service choisi dans la feuille de partage du système.','Apple Santé et Health Connect ne sont utilisés que si vous activez la synchronisation santé, et uniquement pour enregistrer les entraînements terminés, l’énergie active et la distance. L’Application ne lit pas vos données de santé, et rien provenant de ces apps n’est envoyé aux serveurs de Valcue.'],
        retentionH:'6. Conservation, suppression et choix', retention:'Vous pouvez supprimer les données locales dans l’Application lorsque cette option existe, effacer ses données ou la désinstaller. Les notifications, les mises à jour en arrière-plan et la caméra peuvent être désactivées dans les réglages système. Google conserve les données tierces selon ses propres politiques. Pour supprimer une séance partagée ou une autre donnée cloud Valcue, utilisez le contact ci-dessous et joignez le lien ou les informations de session disponibles. La déconnexion conserve vos données sur cet appareil. Vous pouvez supprimer votre compte depuis les Réglages : votre sauvegarde et votre compte de connexion sont alors définitivement supprimés de nos serveurs, tandis que les données déjà présentes sur l’appareil y restent jusqu’à ce que vous les supprimiez.',
        safetyH:'7. Enfants et sécurité', safety:'Valcue s’adresse à un public général de fitness, principalement adulte, et non aux enfants. Les échanges hors de l’appareil sont chiffrés. Aucun système n’étant absolument sûr, n’inscrivez aucune donnée personnelle sensible dans un nom de séance ou un lien partagé.',
        changesH:'8. Modifications', changes:'Nous pouvons mettre à jour cette politique lorsque l’Application ou ses services évoluent. La version en vigueur restera publiée à cette adresse avec une nouvelle date.',
        contactH:'9. Contact', contact:'Pour toute question ou demande d’accès ou de suppression, contactez Nogic via l’assistance indiquée sur l’App Store ou la page d’incidents du projet.', more:'Informations de confidentialité des fournisseurs'
      },
      de: {
        title:'Datenschutzerklärung von Valcue', updated:'Zuletzt aktualisiert: 11. September 2026', intro:'Diese Richtlinie erklärt, wie Valcue (die „App“), herausgegeben von Nogic, mit Informationen umgeht. Du kannst Valcue ohne Konto nutzen; die Anmeldung mit Apple oder Google ist optional und dient der Sicherung deiner Daten.',
        summaryH:'1. Überblick', summary:['Trainingsverlauf, Trainingspläne, Gewichtseinträge, Ziele und Einstellungen werden überwiegend auf dem Gerät gespeichert.','Google Mobile Ads und Google Analytics for Firebase können Geräte-, Nutzungs-, Diagnose- und ungefähre Standortdaten verarbeiten.','Wenn du dich mit Apple oder Google anmeldest, werden Trainingsverlauf, Gewichtseinträge und Routinen in deinem Konto bei Google Firebase gesichert, damit du sie auf einem anderen Handy wiederherstellen kannst.','Ohne Anmeldung bleiben diese Daten auf deinem Gerät. Valcue liest niemals Daten aus Apple Health oder Health Connect; die App speichert dort nur abgeschlossene Trainings, wenn du das einschaltest.'],
        localH:'2. Auf dem Gerät gespeicherte Daten', local:'Die App speichert Trainingspläne, Trainingsverlauf, Gewicht und Ziele, Einstellungen, Erinnerungszeiten und den Status von Premium-Funktionen lokal. Die Daten bleiben dort, bis du Einträge löschst, die App-Daten entfernst oder die App deinstallierst.',
        thirdH:'3. Dienste von Drittanbietern', third:['Google Mobile Ads (AdMob) kann den aus der IP-Adresse abgeleiteten ungefähren Standort, Geräte- oder Werbe-IDs, App-Interaktionen und Diagnosedaten für Werbung, Betrugsprävention, Sicherheit und rechtliche Pflichten verarbeiten.','Google Analytics for Firebase erfasst Ereignisse wie Onboarding, Erstellung von Trainingsplänen, Beginn und Abschluss von Trainings sowie Interaktionen mit Premium-Seiten. Valcue fügt diesen Ereignissen keine Trainingsnamen, Gewichtswerte oder Verlaufsdaten hinzu.','Firebase Authentication erstellt beim Start der App eine anonyme Kennung, und App Check kann IP-Adresse, User-Agent sowie Geräte- und App-Attestierungsdaten verarbeiten, um die Cloud-Funktionen zu schützen.','Wenn du dich anmeldest, übermittelt Apple oder Google deine Kontokennung und, je nach deiner Auswahl, deine E-Mail-Adresse und deinen Namen. Bei „Mit Apple anmelden“ kannst du deine E-Mail-Adresse verbergen.','RevenueCat verarbeitet Kauf- und Abostatus, eine App-Nutzerkennung und Geräteinformationen, um Premium zu verwalten. Wenn du angemeldet bist, wird diese Kennung mit deinem Konto verknüpft, damit Käufe auf ein neues Handy mitkommen.','Firebase Crashlytics erfasst Absturzberichte mit Gerätemodell, Betriebssystemversion und App-Zustand zum Zeitpunkt des Absturzes, damit wir Fehler beheben können.'],
        cloudH:'4. Optionale Cloud-Funktionen', cloud:['Sicherung (nur bei Anmeldung): Trainingsverlauf (Datum, Gerätetyp, Dauer, Distanz, durchschnittliche RPM oder Stufe, Routinename), Gewichtseinträge (Datum und Gewicht) und Routinen (Name, Schwierigkeit, Gerätetyp, Intervalle) werden unter deinem Konto in Google Firebase gespeichert. Synchronisiert wird bei der Anmeldung, beim Öffnen der App oder wenn sie in den Hintergrund wechselt sowie vor dem Abmelden.','Nur dein angemeldetes Konto kann deine Sicherung lesen oder ändern.','Für einen kurzen Trainingslink werden Name, Gerätetyp und Intervalle unter einer zufälligen Link-ID hochgeladen. Jeder mit dem Link kann den Plan abrufen. Ist die Cloud nicht verfügbar, werden die Daten direkt in einen längeren Link eingebettet.','Entfernte iOS-Live-Aktivitäts-Updates können eine anonyme Kennung, den ActivityKit-Push-Token, den Zeitplan und anzeigefertige Trainings- und Intervalltexte senden. Aktive Zeitpläne laufen innerhalb von 12 Stunden ab; Stornodatensätze können bis zu 24 Stunden gespeichert bleiben.','Über Kurzlinks geteilte Trainingspläne können bis zur betrieblichen Löschung oder einer gültigen Löschanfrage gespeichert bleiben. Gib bei einer Anfrage die Link-ID an.'],
        permissionsH:'5. Berechtigungen und Teilen', permissions:['Benachrichtigungen werden nur bei aktivierten Trainingserinnerungen oder Hintergrund-Updates verwendet.','Die Kamera wird nur verwendet, wenn du den QR-Code eines Trainings scannst oder ein Trainingsfoto aufnimmst. Fotos bleiben auf dem Gerät, sofern du sie nicht teilst.','Die Zwischenablage wird ausschließlich auf importierbare Valcue-Trainingslinks geprüft.','Geteilte Inhalte werden von der im System-Teilen-Menü gewählten App oder dem Dienst verarbeitet.','Apple Health und Health Connect werden nur genutzt, wenn du die Gesundheitssynchronisierung einschaltest, und nur zum Speichern abgeschlossener Trainings, aktiver Energie und Distanz. Die App liest keine Gesundheitsdaten, und nichts aus diesen Apps wird an die Server von Valcue gesendet.'],
        retentionH:'6. Speicherdauer, Löschung und Auswahl', retention:'Lokale Daten lassen sich in der App, durch Löschen der App-Daten oder durch Deinstallation entfernen. Benachrichtigungen, Hintergrund-Updates und Kamerazugriff können in den Systemeinstellungen deaktiviert werden. Google speichert Drittanbieterdaten nach eigenen Richtlinien. Für die Löschung eines geteilten Trainings oder anderer Valcue-Cloud-Daten nutze den Kontakt unten und gib verfügbare Link- oder Sitzungsdaten an. Beim Abmelden bleiben deine Daten auf diesem Gerät. Du kannst dein Konto in den Einstellungen löschen; dabei werden deine Sicherung und dein Anmeldekonto dauerhaft von unseren Servern entfernt, während die Daten auf dem Gerät bleiben, bis du sie löschst.',
        safetyH:'7. Kinder und Sicherheit', safety:'Valcue richtet sich an ein allgemeines Fitnesspublikum, hauptsächlich Erwachsene, und nicht an Kinder. Datenübertragungen außerhalb des Geräts sind verschlüsselt. Absolute Sicherheit ist nicht möglich; trage keine sensiblen persönlichen Informationen in Trainingsnamen oder geteilte Links ein.',
        changesH:'8. Änderungen', changes:'Wir können diese Erklärung bei Änderungen an App oder Diensten aktualisieren. Die aktuelle Fassung bleibt mit neuem Datum unter dieser URL verfügbar.',
        contactH:'9. Kontakt', contact:'Wende dich bei Datenschutzfragen sowie Auskunfts- oder Löschanfragen über den im App Store genannten Support oder die Projekt-Issue-Seite an Nogic.', more:'Datenschutzinformationen der Anbieter'
      },
      it: {
        title:'Informativa sulla privacy di Valcue', updated:'Ultimo aggiornamento: 11 settembre 2026', intro:'Questa informativa spiega come Valcue (l’“App”), pubblicata da Nogic, tratta le informazioni. Puoi usare Valcue senza un account; l’accesso con Apple o Google è facoltativo e serve per il backup dei tuoi dati.',
        summaryH:'1. In breve', summary:['Cronologia degli allenamenti, routine, peso, obiettivi e impostazioni sono conservati principalmente sul dispositivo.','Google Mobile Ads e Google Analytics for Firebase possono trattare dati del dispositivo, interazioni, diagnostica e posizione approssimativa.','Se accedi con Apple o Google, lo storico degli allenamenti, le registrazioni del peso e le routine vengono salvati come backup nel tuo account su Google Firebase, così puoi ripristinarli su un altro telefono.','Senza accesso, questi dati restano sul tuo dispositivo. Valcue non legge mai i dati di Apple Salute o Health Connect; salva lì solo gli allenamenti completati se attivi questa opzione.'],
        localH:'2. Dati memorizzati sul dispositivo', local:'L’App salva localmente routine, cronologia, peso e obiettivi, preferenze, promemoria e stato delle funzioni Premium. I dati restano sul dispositivo finché non elimini i record, cancelli i dati dell’App o la disinstalli.',
        thirdH:'3. Servizi di terze parti', third:['Google Mobile Ads (AdMob) può trattare posizione approssimativa ricavata dall’IP, identificatori del dispositivo o pubblicitari, interazioni e diagnostica per annunci, prevenzione delle frodi, sicurezza e obblighi di legge.','Google Analytics for Firebase registra eventi come onboarding, creazione di routine, avvio e completamento degli allenamenti e interazioni con schermate Premium. Valcue non include nomi delle routine, valori del peso o record della cronologia.','Firebase Authentication crea un identificativo anonimo all’avvio dell’App e App Check può trattare indirizzo IP, user agent e dati di attestazione del dispositivo o dell’app per proteggere le funzioni cloud.','Se accedi, Apple o Google condividono l’identificativo del tuo account e, in base alle tue scelte, indirizzo email e nome. Con Accedi con Apple puoi nascondere il tuo indirizzo email.','RevenueCat tratta lo stato di acquisti e abbonamenti, un identificativo utente dell’app e informazioni sul dispositivo per gestire Premium. Quando hai effettuato l’accesso, l’identificativo è collegato al tuo account così gli acquisti ti seguono su un nuovo telefono.','Firebase Crashlytics raccoglie report sugli arresti anomali con modello del dispositivo, versione del sistema e stato dell’App al momento dell’arresto, per aiutarci a risolvere i problemi.'],
        cloudH:'4. Funzioni cloud facoltative', cloud:['Backup (solo con accesso effettuato): storico degli allenamenti (data, tipo di macchina, durata, distanza, RPM o livello medio, nome della routine), registrazioni del peso (data e peso) e routine (nome, difficoltà, tipo di macchina, intervalli) vengono salvati in Google Firebase nel tuo account. La sincronizzazione avviene all’accesso, quando apri l’App o la metti in background e prima di uscire dall’account.','Solo il tuo account con accesso effettuato può leggere o modificare il backup.','Creando un link breve vengono caricati nome della routine, tipo di macchina e intervalli con un ID casuale. Chiunque abbia il link può recuperare la routine. Se il cloud non è disponibile, i dati vengono incorporati direttamente in un link più lungo.','Gli aggiornamenti remoti delle Attività in tempo reale di iOS possono inviare un identificatore anonimo, il token push ActivityKit, la pianificazione e testi pronti per la visualizzazione. Le pianificazioni attive scadono entro 12 ore; i record di annullamento possono restare fino a 24 ore.','Le routine condivise con link brevi possono restare archiviate fino alla rimozione operativa o a una richiesta valida. Per richiederne l’eliminazione, indica l’ID del link.'],
        permissionsH:'5. Autorizzazioni e condivisione', permissions:['Le notifiche sono usate solo se attivi promemoria o aggiornamenti degli intervalli in background.','La fotocamera è usata solo per scansionare il codice QR di una routine o scattare una foto dell’allenamento. Le foto restano sul dispositivo salvo condivisione.','Gli appunti vengono controllati solo per riconoscere un link Valcue importabile.','Ciò che condividi è trattato dall’app o dal servizio scelto nel menu di condivisione del sistema.','Apple Salute e Health Connect vengono usati solo se attivi la sincronizzazione della salute e solo per salvare allenamenti completati, energia attiva e distanza. L’App non legge i tuoi dati sanitari e nessuna informazione di quelle app viene inviata ai server di Valcue.'],
        retentionH:'6. Conservazione, eliminazione e scelte', retention:'Puoi eliminare i dati locali nell’App, cancellandone i dati o disinstallandola. Puoi disattivare notifiche, aggiornamenti in background e fotocamera nelle impostazioni di sistema. Google conserva i dati di terze parti secondo le proprie norme. Per eliminare una routine condivisa o un altro record cloud Valcue, usa il contatto seguente e allega il link o i dati di sessione disponibili. Uscendo dall’account i dati restano su questo dispositivo. Puoi eliminare l’account dalle Impostazioni: backup e account di accesso vengono rimossi definitivamente dai nostri server, mentre i dati già presenti sul dispositivo restano finché non li elimini.',
        safetyH:'7. Minori e sicurezza', safety:'Valcue è rivolta a un pubblico fitness generale, soprattutto adulto, e non ai minori. Il traffico esterno usa connessioni cifrate. Nessun sistema è del tutto sicuro: non inserire informazioni personali sensibili nei nomi delle routine o nei link condivisi.',
        changesH:'8. Modifiche', changes:'Potremmo aggiornare l’informativa quando cambiano l’App o i servizi. La versione corrente resterà a questo URL con una nuova data.',
        contactH:'9. Contatti', contact:'Per domande sulla privacy o richieste di accesso o eliminazione, contatta Nogic tramite l’assistenza indicata sull’App Store o la pagina delle segnalazioni del progetto.', more:'Informazioni sulla privacy dei fornitori'
      },
      pt: {
        title:'Política de Privacidade do Valcue', updated:'Última atualização: 11 de setembro de 2026', intro:'Esta política explica como o Valcue (o “App”), publicado pela Nogic, trata informações. Você pode usar o Valcue sem conta; entrar com Apple ou Google é opcional e serve para fazer backup dos seus registros.',
        summaryH:'1. Resumo', summary:['Histórico de treinos, rotinas, registros de peso, metas e ajustes ficam armazenados principalmente no dispositivo.','Google Mobile Ads e Google Analytics para Firebase podem tratar dados do dispositivo, interações, diagnósticos e localização aproximada.','Se você entrar com Apple ou Google, seu histórico de treinos, registros de peso e rotinas são salvos como backup na sua conta no Google Firebase para que possam ser restaurados em outro celular.','Sem entrar, esses registros ficam no seu dispositivo. O Valcue nunca lê dados do Apple Saúde ou do Health Connect; ele só salva treinos concluídos lá se você ativar essa opção.'],
        localH:'2. Dados armazenados no dispositivo', local:'O Aplicativo salva localmente rotinas, histórico de treinos, peso e metas, preferências, horários de lembretes e estado dos recursos Premium. Esses dados permanecem no dispositivo até você excluir os registros, limpar os dados do Aplicativo ou desinstalá-lo.',
        thirdH:'3. Serviços de terceiros', third:['O Google Mobile Ads (AdMob) pode tratar localização aproximada derivada do IP, identificadores do dispositivo ou de publicidade, interações e diagnósticos para anúncios, prevenção de fraudes, segurança e obrigações legais.','O Google Analytics para Firebase registra eventos como integração inicial, criação de rotinas, início e conclusão de treinos e interações com telas Premium. O Valcue não inclui nomes de rotinas, valores de peso nem registros do histórico nesses eventos.','O Firebase Authentication cria um identificador anônimo quando o App é aberto, e o App Check pode processar endereço IP, user agent e dados de atestação do dispositivo ou do app para proteger os recursos na nuvem.','Se você entrar, a Apple ou o Google compartilham o identificador da sua conta e, conforme suas escolhas, seu e-mail e nome. Com Iniciar sessão com a Apple, você pode ocultar seu e-mail.','O RevenueCat processa o status de compras e assinaturas, um identificador de usuário do app e informações do dispositivo para gerenciar o Premium. Quando você está conectado, esse identificador é vinculado à sua conta para que suas compras acompanhem você em um novo celular.','O Firebase Crashlytics coleta relatórios de falhas com modelo do dispositivo, versão do sistema e estado do App no momento da falha para que possamos corrigir problemas.'],
        cloudH:'4. Recursos opcionais em nuvem', cloud:['Backup (somente quando conectado): histórico de treinos (data, tipo de aparelho, duração, distância, RPM ou nível médio, nome da rotina), registros de peso (data e peso) e rotinas (nome, dificuldade, tipo de aparelho, intervalos) são armazenados no Google Firebase na sua conta. A sincronização ocorre ao entrar, ao abrir o App ou enviá-lo para segundo plano e antes de sair.','Somente a sua conta conectada pode ler ou alterar o seu backup.','Ao criar um link curto, o nome da rotina, o tipo de aparelho e os intervalos são enviados com um ID aleatório. Qualquer pessoa com o link pode obter a rotina. Se a nuvem estiver indisponível, os dados serão incorporados diretamente em um link mais longo.','Atualizações remotas das Atividades ao Vivo do iOS podem enviar identificador anônimo, token push do ActivityKit, programação da sessão e textos prontos para exibição. Programações ativas expiram em até 12 horas; registros de cancelamento podem permanecer por até 24 horas.','Rotinas compartilhadas por links curtos podem permanecer até a exclusão operacional ou uma solicitação válida. Para pedir a exclusão, informe o ID do link.'],
        permissionsH:'5. Permissões e compartilhamento', permissions:['As notificações só são usadas se você ativar lembretes ou atualizações de intervalos em segundo plano.','A câmera só é usada para escanear o código QR de uma rotina ou tirar uma foto do treino. As fotos ficam no dispositivo, a menos que você as compartilhe.','A área de transferência só é consultada para reconhecer links de rotina do Valcue que possam ser importados.','O que você compartilhar será tratado pelo aplicativo ou serviço escolhido no menu de compartilhamento do sistema.','O Apple Saúde e o Health Connect só são usados se você ativar a sincronização de saúde, e apenas para salvar treinos concluídos, energia ativa e distância. O App não lê seus dados de saúde, e nada desses apps é enviado aos servidores do Valcue.'],
        retentionH:'6. Retenção, exclusão e escolhas', retention:'Você pode excluir dados locais dentro do Aplicativo, limpar os dados ou desinstalá-lo. Notificações, atualizações em segundo plano e câmera podem ser desativadas nos ajustes do sistema. O Google retém dados de terceiros conforme suas próprias políticas. Para excluir uma rotina compartilhada ou outro registro do Valcue na nuvem, use o contato abaixo e inclua o link ou os dados de sessão disponíveis. Ao sair da conta, seus registros continuam neste dispositivo. Você pode excluir sua conta em Ajustes: seu backup e sua conta de acesso são removidos permanentemente dos nossos servidores, enquanto os registros já no dispositivo permanecem até você excluí-los.',
        safetyH:'7. Crianças e segurança', safety:'O Valcue é destinado ao público geral de atividades físicas, principalmente adultos, e não é direcionado a crianças. O tráfego externo usa criptografia. Nenhum sistema é totalmente seguro; não inclua informações pessoais sensíveis em nomes de rotinas ou links compartilhados.',
        changesH:'8. Alterações', changes:'Podemos atualizar esta política quando o Aplicativo ou os serviços mudarem. A versão atual continuará neste endereço com uma nova data.',
        contactH:'9. Contato', contact:'Para dúvidas de privacidade ou pedidos de acesso ou exclusão, fale com a Nogic pelo suporte indicado na App Store ou pela página de issues do projeto.', more:'Informações de privacidade dos provedores'
      },
      ru: {
        title:'Политика конфиденциальности Valcue', updated:'Последнее обновление: 11 сентября 2026 г.', intro:'Эта политика объясняет, как Valcue («Приложение»), издаваемое Nogic, обрабатывает информацию. Пользоваться Valcue можно без аккаунта; вход через Apple или Google необязателен и нужен для резервного копирования ваших записей.',
        summaryH:'1. Кратко', summary:['История тренировок, программы, вес, цели и настройки в основном хранятся на устройстве.','Google Mobile Ads и Google Analytics for Firebase могут обрабатывать данные об устройстве, действиях, диагностике и примерном местоположении.','Если вы войдёте через Apple или Google, история тренировок, записи веса и программы сохраняются в резервной копии вашего аккаунта в Google Firebase, чтобы их можно было восстановить на другом телефоне.','Без входа эти записи остаются только на устройстве. Valcue никогда не читает данные из Apple Health или Health Connect и сохраняет туда только завершённые тренировки, если вы включите эту функцию.'],
        localH:'2. Данные на устройстве', local:'Приложение локально хранит программы, историю тренировок, вес и цели, настройки, расписание напоминаний и состояние функций Premium. Данные остаются на устройстве до удаления записей, очистки данных приложения или его удаления.',
        thirdH:'3. Сторонние сервисы', third:['Google Mobile Ads (AdMob) может обрабатывать примерное местоположение по IP-адресу, идентификаторы устройства или рекламы, действия и диагностику для показа рекламы, предотвращения мошенничества, безопасности и соблюдения закона.','Google Analytics for Firebase регистрирует события: прохождение знакомства, создание программы, начало и завершение тренировки, действия на экранах Premium. Valcue не добавляет туда названия программ, значения веса и записи истории.','Firebase Authentication создаёт анонимный идентификатор при запуске Приложения, а App Check может обрабатывать IP-адрес, user agent и данные аттестации устройства и приложения для защиты облачных функций.','При входе Apple или Google передают идентификатор вашего аккаунта и, в зависимости от вашего выбора, адрес электронной почты и имя. При входе через Apple можно скрыть адрес почты.','RevenueCat обрабатывает статус покупок и подписок, идентификатор пользователя приложения и сведения об устройстве для управления Premium. Если вы вошли в аккаунт, этот идентификатор связывается с ним, чтобы покупки сохранились на новом телефоне.','Firebase Crashlytics собирает отчёты о сбоях с моделью устройства, версией ОС и состоянием Приложения в момент сбоя, чтобы мы могли исправлять ошибки.'],
        cloudH:'4. Дополнительные облачные функции', cloud:['Резервное копирование (только после входа): история тренировок (дата, тип тренажёра, длительность, дистанция, средние RPM или уровень, название программы), записи веса (дата и вес) и программы (название, сложность, тип тренажёра, интервалы) хранятся в Google Firebase в вашем аккаунте. Синхронизация происходит при входе, при открытии Приложения или его переходе в фоновый режим, а также перед выходом из аккаунта.','Читать и изменять резервную копию может только ваш аккаунт, в который выполнен вход.','При создании короткой ссылки название программы, тип тренажёра и интервалы загружаются под случайным ID. Любой владелец ссылки может получить программу. Если облако недоступно, данные встраиваются в саму длинную ссылку.','Удалённые обновления iOS Live Activity могут передавать анонимный идентификатор, push-токен ActivityKit, расписание и готовые тексты программы и интервалов. Активные расписания истекают не позднее чем через 12 часов; записи отмены могут храниться до 24 часов.','Программы из коротких ссылок могут храниться до служебного удаления или обоснованного запроса. Для удаления укажите ID ссылки.'],
        permissionsH:'5. Разрешения и обмен', permissions:['Уведомления используются только при включённых напоминаниях или фоновых обновлениях интервалов.','Камера используется только для сканирования QR-кода программы или съёмки фото тренировки. Фото остаются на устройстве, если их не отправить.','Буфер обмена проверяется только для распознавания импортируемой ссылки Valcue.','Отправленные данные обрабатывает выбранное в системном меню приложение или сервис.','Apple Health и Health Connect используются, только если вы включили синхронизацию со здоровьем, и только для сохранения завершённых тренировок, активной энергии и дистанции. Приложение не читает ваши данные о здоровье, и никакие данные из этих приложений не отправляются на серверы Valcue.'],
        retentionH:'6. Хранение, удаление и выбор', retention:'Локальные данные можно удалить в приложении, очисткой данных или удалением приложения. Уведомления, фоновые обновления и камеру можно отключить в настройках системы. Google хранит сторонние данные по собственным правилам. Для удаления общей программы или другой облачной записи Valcue воспользуйтесь контактом ниже и приложите доступную ссылку или данные сеанса. После выхода из аккаунта записи остаются на этом устройстве. Удалить аккаунт можно в настройках: резервная копия и аккаунт для входа будут безвозвратно удалены с наших серверов, а записи на устройстве останутся, пока вы их не удалите.',
        safetyH:'7. Дети и безопасность', safety:'Valcue предназначено для широкой фитнес-аудитории, прежде всего взрослых, и не ориентировано на детей. Внешний трафик шифруется. Абсолютная безопасность невозможна: не указывайте чувствительные персональные данные в названиях программ и общих ссылках.',
        changesH:'8. Изменения', changes:'Политика может обновляться вместе с приложением или сервисами. Актуальная версия и новая дата будут опубликованы по этому адресу.',
        contactH:'9. Контакты', contact:'По вопросам конфиденциальности, доступа или удаления обратитесь в Nogic через поддержку в App Store или страницу задач проекта.', more:'Информация о конфиденциальности поставщиков'
      },
      ar: {
        title:'سياسة خصوصية Valcue', updated:'آخر تحديث: 11 سبتمبر 2026', intro:'توضح هذه السياسة كيفية تعامل Valcue («التطبيق») الصادر عن Nogic مع المعلومات. يمكنك استخدام Valcue دون حساب؛ وتسجيل الدخول باستخدام Apple أو Google اختياري ويُستخدم للنسخ الاحتياطي لسجلاتك.',
        summaryH:'1. الملخص', summary:['يُخزَّن سجل التمارين والبرامج وقياسات الوزن والأهداف والإعدادات بصورة أساسية على جهازك.','قد تعالج Google Mobile Ads وGoogle Analytics for Firebase بيانات الجهاز والتفاعل والتشخيص والموقع التقريبي.','إذا سجّلت الدخول باستخدام Apple أو Google، يتم نسخ سجل تمارينك وسجلات وزنك وبرامجك احتياطيًا في حسابك على Google Firebase لتتمكن من استعادتها على هاتف آخر.','دون تسجيل الدخول، تبقى هذه السجلات على جهازك فقط. لا يقرأ Valcue أي بيانات من Apple Health أو Health Connect، ويحفظ فيهما التمارين المكتملة فقط إذا فعّلت ذلك.'],
        localH:'2. البيانات المخزنة على الجهاز', local:'يخزن التطبيق محليًا البرامج وسجل التمارين والوزن والأهداف والتفضيلات ومواعيد التذكير وحالة ميزات Premium. تبقى هذه البيانات حتى تحذف السجلات أو تمسح بيانات التطبيق أو تزيله.',
        thirdH:'3. خدمات الجهات الخارجية', third:['قد تعالج Google Mobile Ads ‏(AdMob) الموقع التقريبي المستنتج من عنوان IP ومعرّفات الجهاز أو الإعلانات وتفاعلات التطبيق وبيانات التشخيص لعرض الإعلانات ومنع الاحتيال والحفاظ على الأمان والامتثال للقانون.','يسجل Google Analytics for Firebase أحداثًا مثل الإعداد الأولي وإنشاء البرامج وبدء التمرين وإكماله والتفاعل مع شاشات Premium. لا يضع Valcue أسماء البرامج أو قيم الوزن أو سجلات التمرين ضمن هذه الأحداث.','ينشئ Firebase Authentication معرّفًا مجهول الهوية عند تشغيل التطبيق، وقد يعالج App Check عنوان IP ووكيل المستخدم وبيانات التحقق من الجهاز والتطبيق لحماية الميزات السحابية.','عند تسجيل الدخول، تشارك Apple أو Google معرّف حسابك، وبحسب اختيارك، بريدك الإلكتروني واسمك. عند تسجيل الدخول باستخدام Apple يمكنك إخفاء بريدك الإلكتروني.','يعالج RevenueCat حالة المشتريات والاشتراكات ومعرّف مستخدم التطبيق ومعلومات الجهاز لإدارة الاشتراك المميز. عند تسجيل الدخول يُربط هذا المعرّف بحسابك حتى تنتقل مشترياتك معك إلى هاتف جديد.','يجمع Firebase Crashlytics تقارير الأعطال التي تتضمن طراز الجهاز وإصدار النظام وحالة التطبيق وقت العطل حتى نتمكن من إصلاح المشكلات.'],
        cloudH:'4. الميزات السحابية الاختيارية', cloud:['النسخ الاحتياطي (عند تسجيل الدخول فقط): يُخزَّن سجل التمارين (التاريخ، نوع الجهاز، المدة، المسافة، متوسط RPM أو المستوى، اسم البرنامج) وسجلات الوزن (التاريخ والوزن) والبرامج (الاسم، الصعوبة، نوع الجهاز، الفترات) في Google Firebase ضمن حسابك. تتم المزامنة عند تسجيل الدخول، وعند فتح التطبيق أو نقله إلى الخلفية، وقبل تسجيل الخروج.','لا يمكن قراءة نسختك الاحتياطية أو تعديلها إلا من حسابك الذي سجّلت الدخول به.','عند إنشاء رابط قصير، يُرفع اسم البرنامج ونوع الجهاز وتفاصيل الفترات تحت معرّف رابط عشوائي. يستطيع أي شخص يملك الرابط استرداد البرنامج. وإذا لم تتوفر الخدمة السحابية، تُضمَّن البيانات داخل رابط أطول.','قد ترسل تحديثات الأنشطة المباشرة في iOS معرّفًا مجهولًا ورمز دفع ActivityKit وجدول جلسة التمرين ونصوص البرنامج والفترات الجاهزة للعرض. تنتهي الجداول النشطة خلال 12 ساعة، وقد تُحفظ سجلات الإلغاء حتى 24 ساعة.','قد تبقى البرامج المشتركة بروابط قصيرة حتى حذفها تشغيليًا أو ورود طلب حذف صالح. يرجى إرفاق معرّف الرابط بطلب الحذف.'],
        permissionsH:'5. أذونات الجهاز والمشاركة', permissions:['لا تُستخدم الإشعارات إلا عند تفعيل تذكيرات التمرين أو تحديثات الفترات في الخلفية.','لا تُستخدم الكاميرا إلا لمسح رمز QR لبرنامج تمرين أو التقاط صورة للتمرين. تبقى الصور على جهازك ما لم تشاركها.','لا تُفحص الحافظة إلا للتعرّف على رابط برنامج Valcue قابل للاستيراد.','تعالج المعلومات التي تشاركها الجهة التي تختارها من قائمة المشاركة في النظام.','لا يُستخدم Apple Health وHealth Connect إلا إذا فعّلت مزامنة الصحة، وفقط لحفظ التمارين المكتملة والطاقة النشطة والمسافة. لا يقرأ التطبيق بياناتك الصحية، ولا يُرسل أي شيء من هذه التطبيقات إلى خوادم Valcue.'],
        retentionH:'6. الاحتفاظ والحذف والخيارات', retention:'يمكن حذف البيانات المحلية من داخل التطبيق حيثما يتوفر ذلك، أو بمسح بياناته أو إزالته. ويمكن تعطيل الإشعارات والتحديثات في الخلفية والكاميرا من إعدادات النظام. تحتفظ Google ببيانات الطرف الثالث وفق سياساتها. لحذف برنامج مشترك أو سجل سحابي آخر لدى Valcue، استخدم وسيلة الاتصال أدناه وأرفق الرابط أو معلومات الجلسة المتاحة. عند تسجيل الخروج تبقى سجلاتك على هذا الجهاز. يمكنك حذف حسابك من الإعدادات، فتُحذف نسختك الاحتياطية وحساب تسجيل الدخول نهائيًا من خوادمنا، بينما تبقى السجلات الموجودة على الجهاز حتى تحذفها.',
        safetyH:'7. الأطفال والأمان', safety:'Valcue موجه لجمهور اللياقة العام، ولا سيما البالغين، وليس موجهًا للأطفال. تستخدم الاتصالات خارج الجهاز نقلًا مشفرًا. لا يوجد نظام آمن بصورة مطلقة، لذلك لا تضع معلومات شخصية حساسة في أسماء البرامج أو الروابط المشتركة.',
        changesH:'8. التغييرات', changes:'قد نحدّث هذه السياسة عند تغير التطبيق أو خدماته. ستظل النسخة الحالية منشورة على هذا العنوان مع تاريخ تحديث جديد.',
        contactH:'9. التواصل', contact:'للأسئلة المتعلقة بالخصوصية أو طلبات الوصول أو الحذف، تواصل مع Nogic عبر قناة الدعم في App Store أو صفحة مشكلات المشروع.', more:'معلومات الخصوصية لدى مزودي الخدمات'
      },
      vi: {
        title:'Chính sách quyền riêng tư của Valcue', updated:'Cập nhật lần cuối: 11 tháng 9, 2026', intro:'Chính sách này giải thích cách Valcue (“Ứng dụng”) do Nogic phát hành xử lý thông tin. Bạn có thể dùng Valcue mà không cần tài khoản; đăng nhập bằng Apple hoặc Google là tùy chọn và được dùng để sao lưu dữ liệu của bạn.',
        summaryH:'1. Tóm tắt', summary:['Lịch sử tập luyện, chương trình, cân nặng, mục tiêu và cài đặt chủ yếu được lưu trên thiết bị.','Google Mobile Ads và Google Analytics for Firebase có thể xử lý dữ liệu thiết bị, tương tác, chẩn đoán và vị trí gần đúng.','Nếu bạn đăng nhập bằng Apple hoặc Google, lịch sử tập luyện, dữ liệu cân nặng và lịch tập sẽ được sao lưu vào tài khoản của bạn trên Google Firebase để có thể khôi phục trên điện thoại khác.','Nếu không đăng nhập, các dữ liệu này chỉ nằm trên thiết bị của bạn. Valcue không bao giờ đọc dữ liệu từ Apple Health hoặc Health Connect; ứng dụng chỉ lưu các buổi tập đã hoàn thành vào đó nếu bạn bật tính năng này.'],
        localH:'2. Dữ liệu lưu trên thiết bị', local:'Ứng dụng lưu cục bộ chương trình, lịch sử tập luyện, cân nặng và mục tiêu, tùy chọn, lịch nhắc và trạng thái tính năng Premium. Dữ liệu ở lại thiết bị cho đến khi bạn xóa bản ghi, xóa dữ liệu Ứng dụng hoặc gỡ cài đặt.',
        thirdH:'3. Dịch vụ bên thứ ba', third:['Google Mobile Ads (AdMob) có thể xử lý vị trí gần đúng suy ra từ IP, mã nhận dạng thiết bị hoặc quảng cáo, tương tác và chẩn đoán để cung cấp quảng cáo, ngăn gian lận, bảo mật và tuân thủ pháp luật.','Google Analytics for Firebase ghi nhận các sự kiện như hoàn tất hướng dẫn, tạo chương trình, bắt đầu và hoàn thành buổi tập, tương tác với màn hình Premium. Valcue không đưa tên chương trình, số đo cân nặng hoặc lịch sử tập vào các sự kiện này.','Firebase Authentication tạo một mã định danh ẩn danh khi Ứng dụng khởi động, và App Check có thể xử lý địa chỉ IP, user agent và dữ liệu xác thực thiết bị hoặc ứng dụng để bảo vệ các tính năng đám mây.','Khi bạn đăng nhập, Apple hoặc Google chia sẻ mã định danh tài khoản và, tùy lựa chọn của bạn, địa chỉ email và tên. Khi đăng nhập bằng Apple, bạn có thể ẩn địa chỉ email.','RevenueCat xử lý trạng thái mua hàng và gói đăng ký, mã định danh người dùng ứng dụng và thông tin thiết bị để quản lý Premium. Khi bạn đã đăng nhập, mã này được liên kết với tài khoản để giao dịch mua theo bạn sang điện thoại mới.','Firebase Crashlytics thu thập báo cáo sự cố gồm kiểu thiết bị, phiên bản hệ điều hành và trạng thái Ứng dụng khi xảy ra sự cố để chúng tôi khắc phục lỗi.'],
        cloudH:'4. Tính năng đám mây tùy chọn', cloud:['Sao lưu (chỉ khi đã đăng nhập): lịch sử tập luyện (ngày, loại máy, thời lượng, quãng đường, RPM hoặc cấp độ trung bình, tên lịch tập), dữ liệu cân nặng (ngày và cân nặng) và lịch tập (tên, độ khó, loại máy, các hiệp) được lưu trên Google Firebase theo tài khoản của bạn. Dữ liệu được đồng bộ khi đăng nhập, khi mở Ứng dụng hoặc chuyển sang chạy nền, và trước khi đăng xuất.','Chỉ tài khoản đã đăng nhập của bạn mới có thể đọc hoặc thay đổi bản sao lưu.','Khi tạo liên kết ngắn, tên chương trình, loại máy và chi tiết quãng tập được tải lên dưới một ID ngẫu nhiên. Bất kỳ ai có liên kết đều có thể tải chương trình. Nếu đám mây không khả dụng, dữ liệu được nhúng trực tiếp vào một liên kết dài hơn.','Cập nhật Hoạt động trực tiếp iOS từ xa có thể gửi mã nhận dạng ẩn danh, token đẩy ActivityKit, lịch buổi tập và nội dung chương trình/quãng tập sẵn để hiển thị. Lịch đang hoạt động hết hạn trong 12 giờ; bản ghi hủy có thể được giữ tối đa 24 giờ.','Chương trình được chia sẻ bằng liên kết ngắn có thể được lưu cho đến khi xóa trong vận hành hoặc nhận yêu cầu hợp lệ. Hãy cung cấp ID liên kết khi yêu cầu xóa.'],
        permissionsH:'5. Quyền thiết bị và chia sẻ', permissions:['Thông báo chỉ được dùng khi bạn bật lời nhắc hoặc cập nhật quãng tập trong nền.','Camera chỉ được dùng để quét mã QR của chương trình hoặc chụp ảnh buổi tập. Ảnh ở lại thiết bị trừ khi bạn chia sẻ.','Bảng nhớ tạm chỉ được kiểm tra để nhận diện liên kết chương trình Valcue có thể nhập.','Nội dung bạn chia sẻ do ứng dụng hoặc dịch vụ được chọn trong bảng chia sẻ hệ thống xử lý.','Apple Health và Health Connect chỉ được dùng khi bạn bật đồng bộ sức khỏe, và chỉ để lưu buổi tập đã hoàn thành, năng lượng hoạt động và quãng đường. Ứng dụng không đọc dữ liệu sức khỏe của bạn và không gửi bất kỳ thông tin nào từ các ứng dụng đó đến máy chủ của Valcue.'],
        retentionH:'6. Lưu giữ, xóa và lựa chọn', retention:'Bạn có thể xóa dữ liệu cục bộ trong Ứng dụng, xóa dữ liệu ứng dụng hoặc gỡ cài đặt. Có thể tắt thông báo, cập nhật nền và camera trong cài đặt hệ thống. Google lưu dữ liệu bên thứ ba theo chính sách riêng. Để xóa chương trình đã chia sẻ hoặc bản ghi đám mây Valcue khác, hãy dùng liên hệ bên dưới và gửi kèm liên kết hoặc thông tin phiên nếu có. Khi đăng xuất, dữ liệu vẫn được giữ trên thiết bị này. Bạn có thể xóa tài khoản trong Cài đặt; bản sao lưu và tài khoản đăng nhập sẽ bị xóa vĩnh viễn khỏi máy chủ của chúng tôi, còn dữ liệu đã có trên thiết bị vẫn giữ nguyên cho đến khi bạn tự xóa.',
        safetyH:'7. Trẻ em và bảo mật', safety:'Valcue dành cho người tập thể dục nói chung, chủ yếu là người lớn, và không hướng đến trẻ em. Dữ liệu truyền ra ngoài thiết bị được mã hóa. Không hệ thống nào an toàn tuyệt đối; đừng ghi thông tin cá nhân nhạy cảm trong tên chương trình hoặc liên kết chia sẻ.',
        changesH:'8. Thay đổi', changes:'Chúng tôi có thể cập nhật chính sách khi Ứng dụng hoặc dịch vụ thay đổi. Bản hiện hành và ngày cập nhật mới sẽ tiếp tục được đăng tại URL này.',
        contactH:'9. Liên hệ', contact:'Nếu có câu hỏi về quyền riêng tư hoặc yêu cầu truy cập, xóa dữ liệu, hãy liên hệ Nogic qua kênh hỗ trợ trên App Store hoặc trang issue của dự án.', more:'Thông tin quyền riêng tư của nhà cung cấp'
      },
      th: {
        title:'นโยบายความเป็นส่วนตัวของ Valcue', updated:'อัปเดตล่าสุด: 11 กันยายน 2026', intro:'นโยบายนี้อธิบายวิธีที่ Valcue (“แอป”) ซึ่งเผยแพร่โดย Nogic จัดการข้อมูล คุณใช้ Valcue ได้โดยไม่ต้องมีบัญชี การลงชื่อเข้าใช้ด้วย Apple หรือ Google เป็นทางเลือกและใช้เพื่อสำรองข้อมูลของคุณ',
        summaryH:'1. สรุป', summary:['ประวัติการออกกำลังกาย โปรแกรม น้ำหนัก เป้าหมาย และการตั้งค่าส่วนใหญ่จัดเก็บไว้ในอุปกรณ์','Google Mobile Ads และ Google Analytics for Firebase อาจประมวลผลข้อมูลอุปกรณ์ การใช้งาน การวินิจฉัย และตำแหน่งโดยประมาณ','หากคุณลงชื่อเข้าใช้ด้วย Apple หรือ Google ประวัติการออกกำลังกาย บันทึกน้ำหนัก และรูทีนจะถูกสำรองไว้ในบัญชีของคุณบน Google Firebase เพื่อกู้คืนบนโทรศัพท์เครื่องอื่นได้','หากไม่ลงชื่อเข้าใช้ ข้อมูลเหล่านี้จะอยู่ในอุปกรณ์ของคุณเท่านั้น Valcue ไม่อ่านข้อมูลจาก Apple Health หรือ Health Connect และจะบันทึกเฉพาะการออกกำลังกายที่เสร็จแล้วลงไปเมื่อคุณเปิดใช้งาน'],
        localH:'2. ข้อมูลที่เก็บในอุปกรณ์', local:'แอปจัดเก็บโปรแกรม ประวัติการออกกำลังกาย น้ำหนักและเป้าหมาย การตั้งค่า ตารางเตือน และสถานะฟีเจอร์ Premium ไว้ในอุปกรณ์ ข้อมูลจะอยู่จนกว่าคุณจะลบรายการ ล้างข้อมูลแอป หรือถอนการติดตั้ง',
        thirdH:'3. บริการของบุคคลที่สาม', third:['Google Mobile Ads (AdMob) อาจประมวลผลตำแหน่งโดยประมาณจาก IP ตัวระบุอุปกรณ์หรือโฆษณา การใช้งาน และข้อมูลวินิจฉัย เพื่อแสดงโฆษณา ป้องกันการทุจริต รักษาความปลอดภัย และปฏิบัติตามกฎหมาย','Google Analytics for Firebase บันทึกเหตุการณ์ เช่น การเริ่มต้นใช้งาน การสร้างโปรแกรม การเริ่มและจบการออกกำลังกาย และการใช้หน้าจอ Premium โดย Valcue ไม่ใส่ชื่อโปรแกรม ค่าน้ำหนัก หรือประวัติการออกกำลังกายในเหตุการณ์เหล่านี้','Firebase Authentication จะสร้างตัวระบุแบบไม่ระบุตัวตนเมื่อเปิดแอป และ App Check อาจประมวลผลที่อยู่ IP, user agent และข้อมูลยืนยันอุปกรณ์หรือแอปเพื่อปกป้องฟีเจอร์คลาวด์','เมื่อคุณลงชื่อเข้าใช้ Apple หรือ Google จะส่งตัวระบุบัญชีของคุณ และอีเมลกับชื่อตามที่คุณเลือก หากใช้การลงชื่อเข้าใช้ด้วย Apple คุณสามารถซ่อนอีเมลได้','RevenueCat ประมวลผลสถานะการซื้อและการสมัครสมาชิก ตัวระบุผู้ใช้แอป และข้อมูลอุปกรณ์เพื่อจัดการ Premium เมื่อคุณลงชื่อเข้าใช้ ตัวระบุนี้จะเชื่อมกับบัญชีของคุณเพื่อให้การซื้อตามไปยังโทรศัพท์เครื่องใหม่','Firebase Crashlytics เก็บรายงานข้อขัดข้องที่มีรุ่นอุปกรณ์ เวอร์ชันระบบปฏิบัติการ และสถานะของแอปขณะเกิดปัญหา เพื่อให้เราแก้ไขข้อผิดพลาดได้'],
        cloudH:'4. ฟีเจอร์คลาวด์ที่เลือกใช้', cloud:['การสำรองข้อมูล (เฉพาะเมื่อลงชื่อเข้าใช้): ประวัติการออกกำลังกาย (วันที่ ประเภทเครื่อง ระยะเวลา ระยะทาง RPM หรือระดับเฉลี่ย ชื่อรูทีน) บันทึกน้ำหนัก (วันที่และน้ำหนัก) และรูทีน (ชื่อ ระดับความยาก ประเภทเครื่อง ช่วงการออกกำลังกาย) จะถูกเก็บใน Google Firebase ภายใต้บัญชีของคุณ และจะซิงค์เมื่อลงชื่อเข้าใช้ เมื่อเปิดแอปหรือสลับไปทำงานเบื้องหลัง และก่อนออกจากระบบ','มีเพียงบัญชีที่คุณลงชื่อเข้าใช้เท่านั้นที่อ่านหรือแก้ไขข้อมูลสำรองได้','เมื่อสร้างลิงก์สั้น ชื่อโปรแกรม ประเภทเครื่อง และรายละเอียดช่วงจะถูกอัปโหลดภายใต้ ID แบบสุ่ม ทุกคนที่มีลิงก์สามารถเรียกดูโปรแกรมได้ หากคลาวด์ใช้ไม่ได้ ข้อมูลจะฝังอยู่ในลิงก์ที่ยาวกว่าแทน','การอัปเดตกิจกรรมสดของ iOS จากระยะไกลอาจส่งตัวระบุแบบไม่เปิดเผยชื่อ โทเค็นพุช ActivityKit ตารางเซสชัน และข้อความโปรแกรม/ช่วงที่พร้อมแสดง ตารางที่ใช้งานจะหมดอายุภายใน 12 ชั่วโมง และอาจเก็บบันทึกการยกเลิกได้สูงสุด 24 ชั่วโมง','โปรแกรมจากลิงก์สั้นอาจถูกเก็บจนกว่าจะมีการลบในการดำเนินงานหรือได้รับคำขอที่ถูกต้อง โปรดระบุ ID ลิงก์เมื่อขอลบ'],
        permissionsH:'5. สิทธิ์อุปกรณ์และการแชร์', permissions:['ใช้การแจ้งเตือนเฉพาะเมื่อคุณเปิดการเตือนหรืออัปเดตช่วงในเบื้องหลัง','ใช้กล้องเฉพาะเมื่อสแกนคิวอาร์โค้ดโปรแกรมหรือถ่ายภาพการออกกำลังกาย ภาพจะอยู่ในอุปกรณ์เว้นแต่คุณจะแชร์','ตรวจคลิปบอร์ดเฉพาะเพื่อค้นหาลิงก์โปรแกรม Valcue ที่นำเข้าได้','ข้อมูลที่แชร์จะถูกจัดการโดยแอปหรือบริการที่คุณเลือกจากเมนูแชร์ของระบบ','Apple Health และ Health Connect จะใช้เฉพาะเมื่อคุณเปิดการซิงค์สุขภาพ และใช้เพื่อบันทึกการออกกำลังกายที่เสร็จแล้ว พลังงานที่ใช้ และระยะทางเท่านั้น แอปไม่อ่านข้อมูลสุขภาพของคุณ และไม่ส่งข้อมูลใดจากแอปเหล่านั้นไปยังเซิร์ฟเวอร์ของ Valcue'],
        retentionH:'6. การเก็บรักษา การลบ และตัวเลือก', retention:'คุณลบข้อมูลในอุปกรณ์ได้จากภายในแอป การล้างข้อมูลแอป หรือถอนการติดตั้ง ปิดการแจ้งเตือน การอัปเดตเบื้องหลัง และกล้องได้ในการตั้งค่าระบบ Google เก็บข้อมูลของบุคคลที่สามตามนโยบายของตน หากต้องการลบโปรแกรมที่แชร์หรือข้อมูลคลาวด์อื่นของ Valcue ให้ติดต่อด้านล่างพร้อมลิงก์หรือข้อมูลเซสชันที่มี เมื่อออกจากระบบ ข้อมูลยังคงอยู่ในอุปกรณ์นี้ คุณลบบัญชีได้ในการตั้งค่า ซึ่งจะลบข้อมูลสำรองและบัญชีที่ใช้ลงชื่อเข้าใช้ออกจากเซิร์ฟเวอร์ของเราอย่างถาวร ส่วนข้อมูลที่อยู่ในอุปกรณ์จะยังอยู่จนกว่าคุณจะลบเอง',
        safetyH:'7. เด็กและความปลอดภัย', safety:'Valcue มีไว้สำหรับผู้สนใจการออกกำลังกายทั่วไป โดยเฉพาะผู้ใหญ่ และไม่ได้มุ่งเป้าไปที่เด็ก การรับส่งข้อมูลนอกอุปกรณ์ใช้การเข้ารหัส แต่ไม่มีระบบใดปลอดภัยอย่างสมบูรณ์ จึงไม่ควรใส่ข้อมูลส่วนบุคคลที่ละเอียดอ่อนในชื่อโปรแกรมหรือลิงก์ที่แชร์',
        changesH:'8. การเปลี่ยนแปลง', changes:'เราอาจปรับปรุงนโยบายเมื่อแอปหรือบริการเปลี่ยนแปลง เวอร์ชันปัจจุบันและวันที่ใหม่จะเผยแพร่ที่ URL นี้',
        contactH:'9. ติดต่อ', contact:'หากมีคำถามด้านความเป็นส่วนตัวหรือคำขอเข้าถึงหรือลบข้อมูล โปรดติดต่อ Nogic ผ่านช่องทางช่วยเหลือใน App Store หรือหน้า issue ของโครงการ', more:'ข้อมูลความเป็นส่วนตัวของผู้ให้บริการ'
      }
    };

    copy.nl = {
      title:'Privacybeleid van Valcue', updated:'Laatst bijgewerkt: 11 september 2026', intro:'Dit beleid legt uit hoe Valcue (de “App”), uitgegeven door Nogic, met informatie omgaat. Je kunt Valcue zonder account gebruiken; inloggen met Apple of Google is optioneel en dient om je gegevens te back-uppen.',
      summaryH:'1. Samenvatting', summary:['Trainingsgeschiedenis, routines, gewicht, doelen en instellingen worden hoofdzakelijk op je apparaat bewaard.','Google Mobile Ads en Google Analytics for Firebase kunnen apparaat-, gebruiks-, diagnose- en globale locatiegegevens verwerken.','Als je inlogt met Apple of Google, worden je trainingsgeschiedenis, gewichtsgegevens en routines als back-up in je account bij Google Firebase bewaard, zodat je ze op een andere telefoon kunt terugzetten.','Zonder in te loggen blijven die gegevens op je apparaat. Valcue leest nooit gegevens uit Apple Gezondheid of Health Connect; de App slaat daar alleen voltooide trainingen op als je dat inschakelt.'],
      localH:'2. Gegevens op het apparaat', local:'De App bewaart routines, trainingsgeschiedenis, gewicht en doelen, voorkeuren, herinneringen en de status van Premium-functies lokaal. Deze gegevens blijven staan totdat je records verwijdert, de appgegevens wist of de App verwijdert.',
      thirdH:'3. Diensten van derden', third:['Google Mobile Ads (AdMob) kan globale locatie op basis van IP, apparaat- of advertentie-ID’s, appgebruik en diagnostiek verwerken voor advertenties, fraudepreventie, beveiliging en wettelijke verplichtingen.','Google Analytics for Firebase registreert gebeurtenissen zoals onboarding, het maken van routines, het starten en voltooien van trainingen en gebruik van Premium-schermen. Valcue voegt daar geen routinenamen, gewichtswaarden of trainingsrecords aan toe.','Firebase Authentication maakt bij het starten van de App een anonieme ID aan, en App Check kan IP-adres, user-agent en apparaat- of appattestgegevens verwerken om de cloudfuncties te beschermen.','Als je inlogt, deelt Apple of Google je account-ID en, afhankelijk van je keuze, je e-mailadres en naam. Met Inloggen met Apple kun je je e-mailadres verbergen.','RevenueCat verwerkt aankoop- en abonnementsstatus, een app-gebruikers-ID en apparaatgegevens om Premium te beheren. Als je bent ingelogd, wordt die ID aan je account gekoppeld zodat aankopen meegaan naar een nieuwe telefoon.','Firebase Crashlytics verzamelt crashrapporten met apparaatmodel, besturingssysteemversie en de toestand van de App op het moment van de crash, zodat we problemen kunnen oplossen.'],
      cloudH:'4. Optionele cloudfuncties', cloud:['Back-up (alleen als je bent ingelogd): trainingsgeschiedenis (datum, type apparaat, duur, afstand, gemiddelde RPM of niveau, routinenaam), gewichtsgegevens (datum en gewicht) en routines (naam, moeilijkheid, type apparaat, intervallen) worden onder je account opgeslagen in Google Firebase. Ze worden gesynchroniseerd bij het inloggen, bij het openen van de App of wanneer die naar de achtergrond gaat, en voor het uitloggen.','Alleen je ingelogde account kan je back-up lezen of wijzigen.','Een korte deellink uploadt de routinenaam, het apparaattype en de intervallen onder een willekeurige link-ID. Iedereen met de link kan de routine ophalen. Zonder cloud worden de gegevens rechtstreeks in een langere link opgenomen.','Externe iOS Live Activity-updates kunnen een anonieme ID, ActivityKit-pushtoken, trainingsschema en kant-en-klare schermtekst verzenden. Actieve schema’s verlopen binnen 12 uur; annuleringsrecords kunnen tot 24 uur worden bewaard.','Routines met een korte link kunnen worden bewaard tot operationele verwijdering of een geldig verwijderingsverzoek. Vermeld de link-ID in je verzoek.'],
      permissionsH:'5. Toestemmingen en delen', permissions:['Meldingen worden alleen gebruikt als je herinneringen of achtergrondupdates inschakelt.','De camera wordt alleen gebruikt om de QR-code van een routine te scannen of een trainingsfoto te maken. Foto’s blijven op je apparaat tenzij je ze deelt.','Het klembord wordt alleen gecontroleerd op een importeerbare Valcue-routinelink.','Gedeelde informatie wordt verwerkt door de app of dienst die je in het systeemdeelmenu kiest.','Apple Gezondheid en Health Connect worden alleen gebruikt als je gezondheidssynchronisatie inschakelt, en alleen om voltooide trainingen, actieve energie en afstand op te slaan. De App leest je gezondheidsgegevens niet en er wordt niets uit die apps naar de servers van Valcue verstuurd.'],
      retentionH:'6. Bewaren, verwijderen en keuzes', retention:'Verwijder lokale gegevens in de App, door appgegevens te wissen of de App te verwijderen. Meldingen, achtergrondupdates en camera kunnen in de systeeminstellingen worden uitgeschakeld. Google hanteert zijn eigen bewaarbeleid. Neem voor verwijdering van gedeelde routines of andere Valcue-cloudgegevens contact op met de beschikbare link- of sessiegegevens. Na het uitloggen blijven je gegevens op dit apparaat. Je kunt je account verwijderen via Instellingen; je back-up en je inlogaccount worden dan permanent van onze servers verwijderd, terwijl gegevens op het apparaat blijven staan tot je ze zelf verwijdert.',
      safetyH:'7. Kinderen en beveiliging', safety:'Valcue is vooral bedoeld voor volwassen sporters en niet voor kinderen. Extern verkeer is versleuteld, maar geen enkel systeem is volledig veilig. Zet geen gevoelige persoonsgegevens in routinenamen of gedeelde links.',
      changesH:'8. Wijzigingen', changes:'We kunnen dit beleid aanpassen wanneer de App of diensten veranderen. De actuele versie en datum blijven op deze URL staan.',
      contactH:'9. Contact', contact:'Neem voor privacyvragen of inzage- en verwijderingsverzoeken contact op met Nogic via de App Store-ondersteuning of de issuepagina van het project.', more:'Privacyinformatie van dienstverleners'
    };
    copy.da = {
      title:'Valcues privatlivspolitik', updated:'Senest opdateret: 11. september 2026', intro:'Denne politik forklarer, hvordan Valcue (“Appen”), udgivet af Nogic, håndterer oplysninger. Du kan bruge Valcue uden en konto; log ind med Apple eller Google er valgfrit og bruges til at tage backup af dine data.',
      summaryH:'1. Overblik', summary:['Træningshistorik, rutiner, vægt, mål og indstillinger gemmes hovedsageligt på din enhed.','Google Mobile Ads og Google Analytics for Firebase kan behandle enheds-, brugs-, diagnose- og omtrentlige placeringsdata.','Hvis du logger ind med Apple eller Google, bliver din træningshistorik, dine vægtregistreringer og dine rutiner gemt som backup på din konto i Google Firebase, så de kan gendannes på en anden telefon.','Uden login bliver disse data på din enhed. Valcue læser aldrig data fra Apple Sundhed eller Health Connect; Appen gemmer kun afsluttede træninger dér, hvis du slår det til.'],
      localH:'2. Data på enheden', local:'Appen gemmer rutiner, træningshistorik, vægt og mål, præferencer, påmindelser og Premium-status lokalt. Dataene bliver liggende, indtil du sletter poster, rydder appdata eller afinstallerer appen.',
      thirdH:'3. Tredjepartstjenester', third:['Google Mobile Ads (AdMob) kan behandle omtrentligt sted udledt af IP, enheds- eller annonce-id’er, appbrug og diagnosticering til annoncer, forebyggelse af svindel, sikkerhed og lovkrav.','Google Analytics for Firebase registrerer hændelser som onboarding, oprettelse af rutiner, start og afslutning af træning samt brug af Premium-skærme. Valcue tilføjer ikke rutinenavne, vægtværdier eller træningshistorik til disse hændelser.','Firebase Authentication opretter et anonymt id, når Appen starter, og App Check kan behandle IP-adresse, user agent og attesteringsdata for enhed og app for at beskytte cloudfunktionerne.','Når du logger ind, deler Apple eller Google dit konto-id og, afhængigt af dine valg, din e-mailadresse og dit navn. Med Log ind med Apple kan du skjule din e-mailadresse.','RevenueCat behandler købs- og abonnementsstatus, et app-bruger-id og enhedsoplysninger for at administrere Premium. Når du er logget ind, knyttes id’et til din konto, så dine køb følger med til en ny telefon.','Firebase Crashlytics indsamler nedbrudsrapporter med enhedsmodel, styresystemversion og Appens tilstand på tidspunktet for nedbruddet, så vi kan rette fejl.'],
