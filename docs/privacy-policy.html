      cloudH:'4. Valgfrie cloudfunktioner', cloud:['Backup (kun når du er logget ind): træningshistorik (dato, maskintype, varighed, distance, gennemsnitlig RPM eller niveau, rutinenavn), vægtregistreringer (dato og vægt) og rutiner (navn, sværhedsgrad, maskintype, intervaller) gemmes i Google Firebase under din konto. De synkroniseres, når du logger ind, når Appen åbnes eller går i baggrunden, og før du logger ud.','Kun din indloggede konto kan læse eller ændre din backup.','Et kort delingslink uploader rutinenavn, maskintype og intervaller under et tilfældigt link-id. Alle med linket kan hente rutinen. Uden cloud indlejres oplysningerne direkte i et længere link.','Eksterne iOS Live Activity-opdateringer kan sende anonymt id, ActivityKit-pushtoken, træningsplan og visningsklar tekst. Aktive planer udløber inden for 12 timer; annulleringsposter kan gemmes i op til 24 timer.','Rutiner med korte links kan gemmes indtil driftsmæssig sletning eller en gyldig sletteanmodning. Oplys link-id’et i anmodningen.'],
      permissionsH:'5. Tilladelser og deling', permissions:['Notifikationer bruges kun, når du aktiverer påmindelser eller baggrundsopdateringer.','Kameraet bruges kun til at scanne en routines QR-kode eller tage et træningsbillede. Billeder bliver på enheden, medmindre du deler dem.','Udklipsholderen kontrolleres kun for et Valcue-rutinelink, der kan importeres.','Delte oplysninger behandles af den app eller tjeneste, du vælger i systemets delingsmenu.','Apple Sundhed og Health Connect bruges kun, hvis du slår sundhedssynkronisering til, og kun til at gemme afsluttede træninger, aktiv energi og distance. Appen læser ikke dine sundhedsdata, og intet fra disse apps sendes til Valcues servere.'],
      retentionH:'6. Opbevaring, sletning og valg', retention:'Slet lokale data i appen, ved at rydde appdata eller afinstallere. Notifikationer, baggrundsopdateringer og kamera kan slås fra i systemindstillingerne. Google følger sine egne opbevaringsregler. Kontakt os med tilgængelige link- eller sessionsoplysninger for at slette delte rutiner eller andre Valcue-clouddata. Når du logger ud, bliver dine data på denne enhed. Du kan slette din konto under Indstillinger; din backup og din login-konto slettes da permanent fra vores servere, mens data på enheden bliver, indtil du selv sletter dem.',
      safetyH:'7. Børn og sikkerhed', safety:'Valcue er primært beregnet til voksne og er ikke rettet mod børn. Ekstern trafik er krypteret, men intet system er helt sikkert. Skriv ikke følsomme personoplysninger i rutinenavne eller delte links.',
      changesH:'8. Ændringer', changes:'Vi kan opdatere politikken, når appen eller tjenesterne ændres. Den aktuelle version og dato forbliver på denne URL.',
      contactH:'9. Kontakt', contact:'Kontakt Nogic via App Store-supporten eller projektets issue-side ved privatlivsspørgsmål og anmodninger om indsigt eller sletning.', more:'Privatlivsoplysninger fra tjenesteudbydere'
    };
    copy.nb = {
      title:'Valcues personvernerklæring', updated:'Sist oppdatert: 11. september 2026', intro:'Denne erklæringen forklarer hvordan Valcue («Appen»), utgitt av Nogic, behandler informasjon. Du kan bruke Valcue uten konto; innlogging med Apple eller Google er valgfritt og brukes til å ta sikkerhetskopi av dataene dine.',
      summaryH:'1. Sammendrag', summary:['Treningshistorikk, rutiner, vekt, mål og innstillinger lagres hovedsakelig på enheten.','Google Mobile Ads og Google Analytics for Firebase kan behandle enhets-, bruks-, diagnose- og omtrentlige posisjonsdata.','Hvis du logger inn med Apple eller Google, blir treningshistorikken, vektregistreringene og rutinene dine sikkerhetskopiert til kontoen din i Google Firebase, slik at de kan gjenopprettes på en annen telefon.','Uten innlogging blir disse dataene på enheten din. Valcue leser aldri data fra Apple Helse eller Health Connect; Appen lagrer bare fullførte økter der hvis du slår det på.'],
      localH:'2. Data på enheten', local:'Appen lagrer rutiner, treningshistorikk, vekt og mål, innstillinger, påminnelser og Premium-status lokalt. Dataene blir liggende til du sletter oppføringer, tømmer appdata eller avinstallerer appen.',
      thirdH:'3. Tredjepartstjenester', third:['Google Mobile Ads (AdMob) kan behandle omtrentlig posisjon fra IP, enhets- eller annonse-ID-er, appbruk og diagnostikk for annonser, svindelforebygging, sikkerhet og lovkrav.','Google Analytics for Firebase registrerer hendelser som onboarding, oppretting av rutiner, start og fullføring av trening og bruk av Premium-skjermer. Valcue legger ikke inn rutinenavn, vektverdier eller treningshistorikk i disse hendelsene.','Firebase Authentication oppretter en anonym ID når Appen starter, og App Check kan behandle IP-adresse, brukeragent og attesteringsdata for enhet og app for å beskytte skyfunksjonene.','Når du logger inn, deler Apple eller Google konto-ID-en din og, avhengig av valgene dine, e-postadressen og navnet ditt. Med Logg på med Apple kan du skjule e-postadressen din.','RevenueCat behandler kjøps- og abonnementsstatus, en app-bruker-ID og enhetsinformasjon for å administrere Premium. Når du er logget inn, knyttes ID-en til kontoen din slik at kjøpene følger med til en ny telefon.','Firebase Crashlytics samler inn krasjrapporter med enhetsmodell, operativsystemversjon og Appens tilstand da krasjet skjedde, slik at vi kan rette feil.'],
      cloudH:'4. Valgfrie skyfunksjoner', cloud:['Sikkerhetskopi (bare når du er logget inn): treningshistorikk (dato, maskintype, varighet, distanse, gjennomsnittlig RPM eller nivå, rutinenavn), vektregistreringer (dato og vekt) og rutiner (navn, vanskelighetsgrad, maskintype, intervaller) lagres i Google Firebase under kontoen din. De synkroniseres når du logger inn, når Appen åpnes eller går i bakgrunnen, og før du logger ut.','Bare kontoen du er logget inn med, kan lese eller endre sikkerhetskopien.','En kort delingslenke laster opp rutinenavn, apparattype og intervaller under en tilfeldig lenke-ID. Alle med lenken kan hente rutinen. Uten skyen bygges dataene direkte inn i en lengre lenke.','Eksterne iOS Live Activity-oppdateringer kan sende anonym ID, ActivityKit-pushtoken, treningsplan og visningsklar tekst. Aktive planer utløper innen 12 timer; kanselleringsposter kan lagres i opptil 24 timer.','Rutiner med korte lenker kan lagres til driftsmessig sletting eller en gyldig sletteforespørsel. Oppgi lenke-ID-en i forespørselen.'],
      permissionsH:'5. Tillatelser og deling', permissions:['Varsler brukes bare når du aktiverer påminnelser eller bakgrunnsoppdateringer.','Kameraet brukes bare til å skanne QR-koden til en rutine eller ta et treningsbilde. Bilder blir på enheten med mindre du deler dem.','Utklippstavlen sjekkes bare for en importerbar Valcue-rutinelenke.','Delte opplysninger behandles av appen eller tjenesten du velger i systemets delingsmeny.','Apple Helse og Health Connect brukes bare hvis du slår på helsesynkronisering, og bare til å lagre fullførte økter, aktiv energi og distanse. Appen leser ikke helsedataene dine, og ingenting fra disse appene sendes til Valcues servere.'],
      retentionH:'6. Lagring, sletting og valg', retention:'Slett lokale data i appen, ved å tømme appdata eller avinstallere. Varsler, bakgrunnsoppdateringer og kamera kan slås av i systeminnstillingene. Google følger egne lagringsregler. Kontakt oss med tilgjengelige lenke- eller øktopplysninger for å slette delte rutiner eller andre Valcue-skydata. Når du logger ut, blir dataene værende på denne enheten. Du kan slette kontoen din under Innstillinger; sikkerhetskopien og innloggingskontoen slettes da permanent fra serverne våre, mens data på enheten blir liggende til du sletter dem selv.',
      safetyH:'7. Barn og sikkerhet', safety:'Valcue er primært beregnet på voksne og er ikke rettet mot barn. Ekstern trafikk er kryptert, men ingen løsning er helt sikker. Ikke legg følsomme personopplysninger i rutinenavn eller delte lenker.',
      changesH:'8. Endringer', changes:'Vi kan oppdatere erklæringen når appen eller tjenestene endres. Gjeldende versjon og dato forblir på denne nettadressen.',
      contactH:'9. Kontakt', contact:'Kontakt Nogic via App Store-støtten eller prosjektets issue-side ved personvernspørsmål og forespørsler om innsyn eller sletting.', more:'Personverninformasjon fra tjenesteleverandører'
    };

    const languageSelect = document.getElementById('language');
    for (const [code, name] of Object.entries(names)) {
      const option = document.createElement('option'); option.value = code; option.textContent = name; languageSelect.append(option);
    }
    const requested = new URLSearchParams(location.search).get('lang');
    const browser = (navigator.language || 'en').toLowerCase().split('-')[0];
    let active = copy[requested] ? requested : (copy[browser] ? browser : 'en');

    function add(tag, text, parent) { const node = document.createElement(tag); node.textContent = text; parent.append(node); return node; }
    function section(root, heading, content) {
      add('h2', heading, root);
      if (Array.isArray(content)) { const list = document.createElement('ul'); content.forEach(item => add('li', item, list)); root.append(list); }
      else add('p', content, root);
    }
    function render(code) {
      const c = copy[code] || copy.en; active = code;
      document.documentElement.lang = code; document.documentElement.dir = code === 'ar' ? 'rtl' : 'ltr';
      document.title = c.title; languageSelect.value = code;
      document.getElementById('language-label').textContent = languageLabels[code];
      languageSelect.setAttribute('aria-label', languageLabels[code]);
      const root = document.getElementById('policy'); root.replaceChildren();
      add('h1', c.title, root); add('p', c.updated, root).className = 'meta'; add('p', c.intro, root);
      section(root,c.summaryH,c.summary); section(root,c.localH,c.local); section(root,c.thirdH,c.third); section(root,c.cloudH,c.cloud); section(root,c.permissionsH,c.permissions); section(root,c.retentionH,c.retention); section(root,c.safetyH,c.safety); section(root,c.changesH,c.changes); section(root,c.contactH,c.contact);
      const contact = document.createElement('p'); const issue = document.createElement('a'); issue.href='https://github.com/wsng2222/Valcue/issues'; issue.textContent='github.com/wsng2222/Valcue/issues'; contact.append(issue); root.append(contact);
      add('h2', c.more, root); const links = document.createElement('ul');
      [['Google Mobile Ads','https://developers.google.com/admob/android/privacy/play-data-disclosure'],['Firebase','https://firebase.google.com/support/privacy'],['Google','https://policies.google.com/privacy'],['RevenueCat','https://www.revenuecat.com/privacy/'],['Apple','https://www.apple.com/legal/privacy/']].forEach(([label,url]) => { const li=document.createElement('li'); const a=document.createElement('a'); a.href=url; a.textContent=label; li.append(a); links.append(li); }); root.append(links);
      const url = new URL(location.href); url.searchParams.set('lang', code); history.replaceState(null,'',url);
    }
    languageSelect.addEventListener('change', () => render(languageSelect.value));
    render(active);
  </script>
