<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valcue — Structured Interval Cardio</title>
  <meta name="description" content="Structured interval routines for treadmill, bike, and StairMaster. Plan every interval and follow it step by step.">
  <meta property="og:title" content="Valcue — Structured Interval Cardio">
  <meta property="og:description" content="Structured interval routines for treadmill, bike, and StairMaster.">
  <meta property="og:url" content="https://wsng2222.github.io/Valcue/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light dark; --bg:#ffffff; --surface:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --muted:#6e6e73; --line:#e5e5ea; --accent:#f44336; --accent-soft:#fdeceb; }
    @media (prefers-color-scheme: dark) { :root { --bg:#000000; --surface:#1c1c1e; --card:#1c1c1e; --text:#ffffff; --muted:#98989d; --line:#38383a; --accent:#ef5350; --accent-soft:#3a1d1c; } }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Lato',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
    main { max-width:1040px; margin:0 auto; padding:20px 20px 64px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .brand { font-weight:900; font-size:1.25rem; letter-spacing:-0.3px; }
    .brand span { color:var(--accent); }
    select { padding:8px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); font:inherit; }
    .hero { display:grid; grid-template-columns:1.2fr 1fr; gap:40px; align-items:center; padding:48px 0 32px; }
    .eyebrow { display:inline-block; padding:4px 12px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:.85rem; }
    h1 { font-size:clamp(2rem,6vw,3.2rem); line-height:1.15; letter-spacing:-1px; margin:16px 0 14px; font-weight:900; word-break:keep-all; }
    .lead { font-size:1.1rem; color:var(--muted); margin:0 0 28px; word-break:keep-all; }
    .stores { display:flex; flex-wrap:wrap; gap:12px; }
    .store { display:inline-flex; align-items:center; gap:10px; padding:12px 20px; border-radius:14px; background:var(--text); color:var(--bg); text-decoration:none; font-weight:700; }
    .store small { display:block; font-weight:400; font-size:.72rem; opacity:.8; line-height:1.1; }
    .store svg { width:22px; height:22px; fill:currentColor; flex:none; }
    .phone { width:min(300px,100%); margin:0 auto; aspect-ratio:9/19; border-radius:44px; border:10px solid var(--text); background:#000; color:#fff; padding:28px 20px; display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 30px 60px rgba(0,0,0,.18); }
    .phone .label { font-size:.8rem; opacity:.6; text-transform:uppercase; letter-spacing:1px; }
    .phone .interval { font-size:1.6rem; font-weight:900; color:#ef5350; }
    .phone .time { font-size:3.6rem; font-weight:900; letter-spacing:-2px; line-height:1; }
    .phone .next { background:#1c1c1e; border-radius:16px; padding:12px 14px; font-size:.95rem; display:flex; gap:10px; align-items:center; }
    .phone .bar { height:6px; border-radius:3px; background:#38383a; overflow:hidden; }
    .phone .bar i { display:block; height:100%; width:62%; background:#ef5350; }
    .features { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:32px; }
    .feature { background:var(--surface); border-radius:20px; padding:24px; }
    .feature .icon { font-size:1.8rem; }
    .feature h3 { margin:10px 0 6px; font-size:1.1rem; }
    .feature p { margin:0; color:var(--muted); word-break:keep-all; }
    .cta { text-align:center; margin-top:56px; padding:40px 20px; border-radius:24px; background:var(--accent-soft); }
    .cta h2 { margin:0 0 20px; font-size:clamp(1.4rem,4vw,2rem); word-break:keep-all; }
    .cta .stores { justify-content:center; }
    footer { margin-top:40px; display:flex; flex-wrap:wrap; gap:16px; justify-content:center; color:var(--muted); font-size:.9rem; }
    footer a { color:var(--muted); }
    @media (max-width:760px) { .hero { grid-template-columns:1fr; padding-top:28px; } .phone { width:min(240px,100%); } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">Val<span>cue</span></div>
      <select id="language" aria-label="Language"><option value="en">English</option><option value="ko">한국어</option></select>
    </header>

    <section class="hero">
      <div>
        <span class="eyebrow" data-k="eyebrow"></span>
        <h1 data-k="title"></h1>
        <p class="lead" data-k="lead"></p>
        <div class="stores" data-stores></div>
      </div>
      <div class="phone" aria-hidden="true">
        <div>
          <div class="label" data-k="phoneLabel"></div>
          <div class="interval" data-k="phoneInterval"></div>
        </div>
        <div class="time">01:24</div>
        <div class="bar"><i></i></div>
        <div class="next">⏭ <span data-k="phoneNext"></span></div>
      </div>
    </section>

    <section class="features" id="features"></section>

    <section class="cta">
      <h2 data-k="ctaTitle"></h2>
      <div class="stores" data-stores></div>
    </section>

    <footer>
      <a href="support.html" data-k="support"></a>
      <a href="privacy-policy.html" data-k="privacy"></a>
      <a href="terms-of-service.html" data-k="terms"></a>
    </footer>
  </main>

  <script>
    const APP_STORE = 'https://apps.apple.com/app/id6794246554';
    const PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.nogic.valcue';
    const appleIcon = '<svg viewBox="0 0 24 24"><path d="M16.37 12.6c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.48.83-.72 0-1.83-.81-3-.79-1.54.02-2.97.9-3.76 2.28-1.6 2.78-.41 6.9 1.15 9.15.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.38 0 1.77.74 2.98.72 1.23-.02 2.01-1.12 2.76-2.23.87-1.28 1.23-2.52 1.25-2.58-.03-.01-2.4-.92-2.42-3.66zM14.1 5.84c.63-.77 1.06-1.83.94-2.89-.91.04-2.01.61-2.66 1.37-.58.67-1.1 1.76-.96 2.8 1.01.08 2.05-.52 2.68-1.28z"/></svg>';
    const playIcon = '<svg viewBox="0 0 24 24"><path d="M3.6 2.3c-.2.2-.3.6-.3 1v17.4c0 .4.1.8.3 1l9.7-9.7L3.6 2.3zm10.7 10.7 2.8 2.8-11.6 6.6 8.8-9.4zm0-2L5.5 1.6l11.6 6.6-2.8 2.8zm3.9-2.2 3.2 1.8c.9.5.9 1.3 0 1.8l-3.2 1.8-3-3 3-2.4z"/></svg>';

    const copy = {
      en: {
        eyebrow:'Treadmill · Bike · StairMaster',
        title:'Every interval, planned.',
        lead:'Set speed, incline, and level for each interval, then follow the plan step by step. No more guessing on the treadmill.',
        phoneLabel:'Interval 3 of 8', phoneInterval:'Run · 10 km/h', phoneNext:'Next: Walk · 6 km/h',
        appStore:['Download on the','App Store'], playStore:['Get it on','Google Play'],
        features:[
          ['🧩','Build your intervals','Set time, speed, incline, and level for every interval. Repeat patterns in one tap.'],
          ['🧗','Ready-made routines','Beginner to advanced routines for treadmill, bike, and StairMaster.'],
          ['⏱️','Follow the plan','Current and next interval at a glance, with alerts before each change and on your lock screen.'],
          ['✨','AI routine builder','Pick a goal and difficulty — get a routine in seconds.'],
          ['📱','Share with a QR code','Send your favorite routine to a friend with a scan.'],
          ['📈','History & weight','Every session saved, with achievements and a weight chart. Syncs to Apple Health.']
        ],
        ctaTitle:'Make your next cardio session count.',
        support:'Support', privacy:'Privacy Policy', terms:'Terms of Service'
      },
      ko: {
        eyebrow:'러닝머신 · 사이클 · 천국의 계단',
        title:'인터벌, 계획대로 체계적으로.',
        lead:'구간마다 속도·경사·레벨을 짜두고 그대로 따라가세요. 러닝머신 위에서 대충 뛰는 운동은 이제 끝.',
        phoneLabel:'8구간 중 3구간', phoneInterval:'달리기 · 10 km/h', phoneNext:'다음: 걷기 · 6 km/h',
        appStore:['다운로드','App Store'], playStore:['다운로드','Google Play'],
        features:[
          ['🧩','구간 직접 짜기','구간마다 시간·속도·경사·레벨 설정. 패턴 반복도 한 번에.'],
          ['🧗','추천 루틴','러닝머신·사이클·천국의 계단, 초급부터 고급까지 준비돼 있어요.'],
          ['⏱️','계획대로 진행','지금 구간과 다음 구간을 한눈에. 바뀌기 전에 알려주고 잠금화면에도 떠요.'],
          ['✨','AI 루틴 만들기','목표와 난이도만 고르면 루틴이 바로 만들어져요.'],
          ['📱','QR로 루틴 공유','좋았던 루틴을 친구에게 QR 한 번으로 보내요.'],
          ['📈','기록 · 체중 관리','운동 기록과 업적, 체중 그래프까지. 건강 앱에도 저장돼요.']
        ],
        ctaTitle:'다음 유산소는 계획대로.',
        support:'고객지원', privacy:'개인정보처리방침', terms:'이용약관'
      }
    };

    function storeButton(href, icon, [small, big]) {
      return `<a class="store" href="${href}" target="_blank" rel="noopener">${icon}<span><small>${small}</small>${big}</span></a>`;
    }

    function render(lang) {
      const c = copy[lang] || copy.en;
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-k]').forEach(el => { el.textContent = c[el.dataset.k]; });
      document.querySelectorAll('[data-stores]').forEach(el => {
        el.innerHTML = storeButton(APP_STORE, appleIcon, c.appStore) + storeButton(PLAY_STORE, playIcon, c.playStore);
      });
      document.getElementById('features').innerHTML = c.features
        .map(([icon, title, body]) => `<div class="feature"><div class="icon">${icon}</div><h3>${title}</h3><p>${body}</p></div>`).join('');
    }

    const select = document.getElementById('language');
    const params = new URLSearchParams(location.search);
    const initial = params.get('lang') || ((navigator.language || 'en').startsWith('ko') ? 'ko' : 'en');
    select.value = copy[initial] ? initial : 'en';
    select.addEventListener('change', () => render(select.value));
    render(select.value);
  </script>
</body>
</html>
